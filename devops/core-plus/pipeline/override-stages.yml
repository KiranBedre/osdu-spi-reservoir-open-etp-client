variables:
  CIMPL_SERVICE: "oetp-client"
  CIMPL_SUPPORTED_PLATFORM: "linux/amd64"
  DATA_PARTITION_ID: "osdu"
  CIMPL_DNS_NAME: "osdu.$CIMPL_DOMAIN"
  CIMPL_HELM_DEPLOYMENT_DIR: "devops/core-plus/deploy"
  CIMPL_HELM_PACKAGE_NAME: "cimpl-$CIMPL_SERVICE-deploy"
  # The in-repo Bruno collection (bruno/) replaces the external Postman
  # collection previously fetched from osdu/qa at runtime.

cimpl-containerize-gitlab:
  tags: ["osdu-medium"]
  needs: ["compile-and-unit-test"]
  variables:
    CIMPL_BUILD_PATH: "devops/core-plus/deploy/Dockerfile"
    CIMPL_BUILD_ARGS: "--build-arg DIST=dist.tgz"

cimpl-containerize-bootstrap-gitlab:
  needs: []

.cimpl_bruno_tests:
  script:
    - npm install -g @usebruno/cli
    - >
      ACCESS_TOKEN=$(curl -s -X POST "${CIMPL_TOKEN_URL}"
      -d "grant_type=refresh_token"
      -d "client_id=${CIMPL_CLIENT_ID}"
      -d "client_secret=${CIMPL_CLIENT_SECRET}"
      -d "refresh_token=${CIMPL_REFRESH_TOKEN}"
      -d "scope=openid"
      | python3 -c "import sys,json; print(json.load(sys.stdin)['access_token'])")
    - export BRU_ENV="--env CI --env-var access_token=${ACCESS_TOKEN} --env-var RESERVOIR_DDMS_HOST=${CIMPL_DNS_NAME}/api/reservoir-ddms/v2 --env-var DATA_PARTITION_ID=${DATA_PARTITION_ID} --env-var ENTITLEMENTS_DOMAIN=${ENTITLEMENTS_DOMAIN}"
    - bru run bruno/_Setup  $BRU_ENV
    - bru run bruno/Health   $BRU_ENV
    - bru run bruno/Dataspaces $BRU_ENV
    - bru run bruno/Resources $BRU_ENV
    - bru run bruno/Arrays    $BRU_ENV
    - bru run bruno/Transactions $BRU_ENV
    - bru run bruno/Query     $BRU_ENV
    - bru run bruno/_Cleanup  $BRU_ENV || true

cimpl-test:
  tags: ["osdu-small"]
  stage: integration
  image: node:20-alpine
  allow_failure: true
  retry: 1
  extends:
    - .cimpl-variables
  script:
    - !reference [.cimpl_bruno_tests, script]

cimpl-acceptance-test:
  extends:
    - .cimpl-variables

# dev2

cimpl-dev2-test:
  tags: ["osdu-small"]
  stage: integration
  image: node:20-alpine
  allow_failure: false
  retry: 1
  extends:
    - .cimpl-dev2-variables
  script:
    - !reference [.cimpl_bruno_tests, script]

cimpl-dev2-acceptance-test:
  extends:
    - .cimpl-dev2-variables

cimpl-dev2-acceptance-test-python:
  extends:
    - .cimpl-dev2-variables

# Disable the cimpl-check-openapi-spec job as this is a WebSocket ETP server and has no OpenAPI spec
cimpl-check-openapi-spec:
  rules:
    - when: never
