variables:
  CIMPL_SERVICE: "oetp-client"
  CIMPL_SUPPORTED_PLATFORM: "linux/amd64"
  DATA_PARTITION_ID: "osdu"
  CIMPL_DNS_NAME: "osdu.$CIMPL_DOMAIN"
  CIMPL_HELM_DEPLOYMENT_DIR: "devops/core-plus/deploy"
  CIMPL_HELM_PACKAGE_NAME: "cimpl-$CIMPL_SERVICE-deploy"
  # Path to the Reservoir DDMS postman collection within osdu/qa.
  # Named RESERVOIR_DDMS_COLLECTION_PATH (not COLLECTION_PATH) to avoid
  # collision with an inherited group-level CI variable named COLLECTION_PATH
  # that points at the stale v3.0 *_NotRun.json file.
  RESERVOIR_DDMS_COLLECTION_PATH: "Postman%20Collection/45_CICD_Reservoir_DDMS/Reservoir%20DDMS%20CI-CD%20v3.1.postman_collection.json"

cimpl-containerize-gitlab:
  tags: ["osdu-medium"]
  needs: ["compile-and-unit-test"]
  variables:
    CIMPL_BUILD_PATH: "devops/core-plus/deploy/Dockerfile"
    CIMPL_BUILD_ARGS: "--build-arg DIST=dist.tgz"

cimpl-containerize-bootstrap-gitlab:
  needs: []

.cimpl_bruno_tests:
  script:
    - apk add --no-cache curl
    - npm install -g @usebruno/cli
    - >
      ACCESS_TOKEN=$(curl -s -X POST "${CIMPL_TOKEN_URI}"
      -d "grant_type=client_credentials"
      -d "client_id=${CIMPL_CLIENT_ID}"
      -d "client_secret=${CIMPL_CLIENT_SECRET}"
      -d "scope=openid"
      | node -e "process.stdin.resume();let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>process.stdout.write(JSON.parse(d).access_token))")
    # CIMPL_DNS_NAME is defined scheme-less ("osdu.$CIMPL_DOMAIN"). Bruno needs an
    # explicit scheme or it cannot reach the Istio https listener (every request
    # 404s at the gateway). Normalize to exactly one https:// scheme.
    - |
      RDMS_HOST="${CIMPL_DNS_NAME#http://}"; RDMS_HOST="${RDMS_HOST#https://}"
      export RDMS_BASE="https://${RDMS_HOST}/api/reservoir-ddms/v2"
    - export BRU_ENV="--env CI --env-var access_token=${ACCESS_TOKEN} --env-var RESERVOIR_DDMS_HOST=${RDMS_BASE} --env-var DATA_PARTITION_ID=${DATA_PARTITION_ID} --env-var ENTITLEMENTS_DOMAIN=${ENTITLEMENTS_DOMAIN}"
    - cd bruno
    # This client repo validates the REST->ETP proxy; it complements (does not
    # replicate) the open-etp-server data tests. _Setup is the self-contained
    # REST round-trip (create dataspace -> transaction -> put objects -> put
    # array -> commit) and shares runtime state across its ordered requests.
    # Resources/Arrays/Transactions read-backs need that same-invocation seed
    # state and Query needs the server-seeded demo/Volve catalog, so they are
    # not run as standalone folders here.
    - bru run _Setup  $BRU_ENV
    - bru run Health   $BRU_ENV
    - bru run Dataspaces $BRU_ENV
    - bru run _Cleanup  $BRU_ENV || true

cimpl-test:
  tags: ["osdu-small"]
  stage: integration
  image: node:20-alpine
  allow_failure: true
  retry: 1
  extends:
    - .cimpl-variables
  script:
    - !reference [.cimpl_bruno_tests, script]

cimpl-acceptance-test:
  extends:
    - .cimpl-variables

# dev2

cimpl-dev2-test:
  tags: ["osdu-small"]
  stage: integration
  image: node:20-alpine
  allow_failure: false
  retry: 1
  extends:
    - .cimpl-dev2-variables
  script:
    - !reference [.cimpl_bruno_tests, script]

cimpl-dev2-acceptance-test:
  extends:
    - .cimpl-dev2-variables

cimpl-dev2-acceptance-test-python:
  extends:
    - .cimpl-dev2-variables

# Postman/Newman tests (legacy, in parallel with Bruno)
.cimpl_postman_tests:
  script:
    - export GET_COLLECTION_URL="${CIMPL_COLLECTION_HOST}/${CIMPL_COLLECTION_BRANCH}/${RESERVOIR_DDMS_COLLECTION_PATH}?inline=false"
    - echo "Get a collection from ${GET_COLLECTION_URL}"
    - >
      echo "[{ \"CLIENT_ID\": \"${CIMPL_CLIENT_ID}\", \"CLIENT_SECRET\": \"${CIMPL_CLIENT_SECRET}\", \"grant_type\": \"${CIMPL_GRANT_TYPE}\", \"refresh_token\": \"${CIMPL_REFRESH_TOKEN}\"}]" > test_config_file.json
    - curl "${GET_COLLECTION_URL}" > collection.json && COLLECTION=collection.json
    - |
      curl --header "data-partition-id: ${DATA_PARTITION_ID}" "${CIMPL_POSTMAN_ENV_URL}" > environment.json && ENVIRONMENT=environment.json
    - newman run "$COLLECTION" --working-dir . -e "${ENVIRONMENT}" -d test_config_file.json --delay-request 3000 --env-var TENANT_ID=${CIMPL_TENANT} --env-var HOSTNAME=${CIMPL_DNS_NAME} --env-var RESERVOIR_DDMS_HOST=${CIMPL_DNS_NAME}/api/reservoir-ddms/v2 || exit $?

cimpl-test-postman:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-cimpl/image-for-postman-tests/osdu-cimpl-image-for-postman:df5a6d3c
  allow_failure: true
  retry: 1
  extends:
    - .cimpl-variables
  script:
    - !reference [.cimpl_postman_tests, script]
  rules:
    - if: '$CIMPL == "1" && $RUN_POSTMAN_TESTS == "1"'
      when: on_success
    - when: never

cimpl-dev2-test-postman:
  tags: ["osdu-small"]
  stage: integration
  image: community.opengroup.org:5555/osdu/platform/deployment-and-operations/base-containers-cimpl/image-for-postman-tests/osdu-cimpl-image-for-postman:df5a6d3c
  allow_failure: true
  retry: 1
  extends:
    - .cimpl-dev2-variables
  script:
    - !reference [.cimpl_postman_tests, script]
  rules:
    - if: '$CIMPL == "1" && $RUN_POSTMAN_TESTS == "1"'
      when: on_success
    - when: never

# Disable the cimpl-check-openapi-spec job as this is a WebSocket ETP server and has no OpenAPI spec
cimpl-check-openapi-spec:
  rules:
    - when: never
