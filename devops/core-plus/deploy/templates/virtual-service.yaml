apiVersion: networking.istio.io/v1alpha3
kind: VirtualService
metadata:
  name: {{ .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  hosts:
    {{- if and .Values.global.domain .Values.global.onPremEnabled }}
    - {{ printf "osdu.%s" .Values.global.domain | quote }}
    {{- else if .Values.global.domain }}
    - {{ .Values.global.domain | quote }}
    {{- else }}
    - "*"
    {{- end }}
  gateways:
    - service-gateway
  http:
    - match:
        - uri:
            prefix: {{ .Values.data.rdmsRestRootPath | quote }}
      route:
        - destination:
            port:
              number: 8003
            host: {{ printf "%s.%s.svc.cluster.local" .Values.conf.appName .Release.Namespace | quote }}
      # Manifest builds over large dataspaces are inherently long-running
      # (linear in object count: ETP fetch + convert per object). The mesh
      # default route timeout (~15s) cuts big-dataspace builds mid-flight and
      # surfaces as an opaque connection drop (HTTP 000/500) at the client.
      # 300s matches the Azure AGIC request-timeout and the ingest DAG budget.
      timeout: 300s
