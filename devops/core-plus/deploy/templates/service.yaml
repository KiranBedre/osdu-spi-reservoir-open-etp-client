apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.conf.appName | quote }}
  namespace: {{ .Release.Namespace | quote }}
spec:
  ports:
  - port: {{ .Values.data.rdmsRestPort }}
    targetPort: {{ .Values.data.rdmsRestPort }}
    protocol: TCP
    name: http
  selector:
    app: {{ .Values.conf.appName | quote }}
