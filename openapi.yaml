                    - 2.2.0
                  description: RESQML version (default 2.2.0).
                hdfUuid:
                  type: string
                  description: >-
                    EpcExternalPartReference the column arrays hang off. Written
                    automatically when absent from the dataspace.
                keyColumns:
                  type: array
