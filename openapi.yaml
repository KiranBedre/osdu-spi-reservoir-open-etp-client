  /Reservoir/v2/dataspaces:
    post:
      description: >-
        Create one or more new dataspaces. Use path-style names (e.g.,
        `projectA/Scenario1`) for organization.


        **CustomData**: Attach OSDU-relevant metadata (viewers, owners, legal
        tags) as key-value pairs. These are stored as ETP resource custom data
        and used during manifest generation.
      operationId: DataspaceMutationsAPI_PostDataspace
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        description: JSON array of Dataspace description
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                type: object
                properties:
                  DataspaceId:
                    type: string
                    description: Name of dataspace
                    example: demo/drogon
                    maxLength: 2048
                    pattern: ^[^/]+(\/[^/]+)?$
                  Path:
                    type: string
                    description: Path of dataspace
                    example: demo/drogon
                    maxLength: 2048
                    pattern: ^[^\r\n'"]+$
                  CustomData:
                    type: object
                    description: Additional data
                    example:
                      project: Drogon
                      discipline: Reservoir
                    additionalProperties:
                      type: string
                      pattern: ^[a-zA-Z0-9 ]*$
                      maxLength: 2048
                required:
                  - DataspaceId
                additionalProperties: false
            examples:
              new scenario description:
                value:
                  - DataspaceId: projectA/Scenario1
                    Path: projectA/Scenario1
                    CustomData:
                      viewers:
                        - data.default.viewers@osdu.example.com
                      owners:
                        - data.default.owners@osdu.example.com
                      legaltags:
                        - osdu-ReservoirDDMS-Legal-Tag
                      otherRelevantDataCountries:
                        - US
                        - UK
                      key: value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  type: string
                  maxLength: 2048
                  pattern: >-
                    ^(?:eml:\/\/\/|^eml:\/\/\/dataspace\('[^'"]*?(?:''[^'"]*?)*'\))$
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
