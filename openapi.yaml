              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 500
                    maximum: 500
                    example: 500
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        default:
          description: Unknown Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
