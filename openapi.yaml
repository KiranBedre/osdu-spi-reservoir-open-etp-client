  /Reservoir/v2/dataspaces/{dataspaceId}/resources/{dataObjectType}/{guid}/arrays/{pathInResource}/compute:
    get:
      description: >-
        GET shortcut for the two most common server-side array computations; the
        full envelope (`reduce`, `where-multi`, `arith`, async jobs) is `POST
        /dataspaces/{dataspaceId}/arrays/compute` under Query.


        **op=stats** folds the array into a fixed-size summary (count,
        null-count, min/max/mean/stddev/sum) **inside the store**, without
        transferring the array bytes. Optionally pass `rangeLo`&`rangeHi` to
        also get `inRangeCount` (values within the inclusive window) in the same
        pass; add `bins` (with a range) to also fold a histogram over `[rangeLo,
        rangeHi]` and derive `p10`/`p50`/`p90` (net-pay / saturation
        distributions without downloading the array).


        **op=where** evaluates the `[rangeLo, rangeHi]` predicate (both
        required) over the array **inside the store** and returns the count of
        matching cells, their inclusive ijk bounding box and their ijk centroid
        (aim point), the primitive behind targeting queries.


        Returns 501 when the connected store does not support the compute
        extensions.
      operationId: DataArrayReadAPI_GetArrayCompute
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: dataObjectType
          required: true
          in: path
          description: Energistics type of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^(?<domainFamily>resqml|eml|witsml|prodml)(?<domainVersion>\d+).(?<dataType>(obj_)?\w+)$
            example: eml20.obj_EpcExternalPartReference
            type: string
        - name: guid
          required: true
          in: path
          description: Unique Id of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 53395ada-6f93-4bac-b506-d45997ded2a2
            type: string
        - name: pathInResource
          required: true
          in: path
          description: Identifier of the array inside the container.
          schema:
            maxLength: 2048
            pattern: ^(\/?[\w-]+)+$
            example: /RESQML/a3f31b20-c93a-4682-8f6c-71be087202a4/points_patch0
            type: string
        - name: op
          required: true
          in: query
          description: >-
            Computation to run: `stats` (summary, optional range + histogram) or
            `where` (range predicate count + ijk bbox/centroid;
            `rangeLo`/`rangeHi` required).
          schema:
            enum:
              - stats
              - where
            type: string
        - name: version
          required: false
          in: query
          description: Optional version of the object
          schema:
            type: string
            pattern: ^[^']*?(?:''[^']*?)*$
            maxLength: 2048
        - name: rangeLo
          required: false
          in: query
          description: >-
            Lower bound (inclusive) of an optional range predicate; when both
            `rangeLo` and `rangeHi` are supplied the store also returns
            `inRangeCount` (values within [rangeLo, rangeHi]) in the same pass.
          schema:
            type: number
        - name: rangeHi
          required: false
          in: query
          description: >-
            Upper bound (inclusive) of an optional range predicate; must be
            supplied together with `rangeLo`.
          schema:
            type: number
        - name: bins
          required: false
          in: query
          description: >-
            Number of fixed-width histogram bins over the `[rangeLo, rangeHi]`
            domain. When supplied (and > 0, with a range) the store folds a
            histogram in the same pass and returns
            `histogram`/`histBins`/`histLo`/`histHi`/`histUnderflow`/`histOverflow`
            plus percentiles `p10`/`p50`/`p90` (interpolated from the cumulative
            histogram). Requires both `rangeLo` and `rangeHi`.
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100000
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: >-
            Success. `op=stats` returns the statistics summary; `op=where`
            returns the predicate result.
          content:
            application/json:
              schema:
                oneOf:
                  - title: stats
                    type: object
                    properties:
                      valid:
                        type: boolean
                        description: >-
                          false when the array held no finite value (all
                          null/NaN or non-numeric).
                        example: true
                      count:
                        type: integer
                        description: Finite (non-null) values folded into the summary.
                        example: 187500
                      nullCount:
                        type: integer
                        description: Explicit-null and NaN values that were skipped.
                        example: 12500
                      minimum:
                        type: number
                        example: 0.02
                      maximum:
                        type: number
                        example: 0.34
                      mean:
                        type: number
                        example: 0.187
                      stddev:
                        type: number
                        description: Population standard deviation.
                        example: 0.041
                      sum:
                        type: number
                        example: 35062.5
                      inRangeCount:
                        type: integer
                        description: >-
                          Finite values inside the requested inclusive [rangeLo,
                          rangeHi] window (only when a range was asked).
                        example: 4200
                      rangeLo:
                        type: number
                        example: 0.1
                      rangeHi:
                        type: number
                        example: 0.25
                      histogram:
                        type: array
                        description: >-
                          Per-bin counts of a fixed-width histogram over
                          [histLo, histHi], folded in the same pass (only when
                          `bins` was requested). Bin i covers [histLo + i*w,
                          histLo + (i+1)*w) with w = (histHi-histLo)/bins.
                        items:
                          type: integer
                        example:
                          - 0
                          - 12
                          - 480
                          - 1203
                          - 640
                          - 85
                      histBins:
                        type: integer
                        description: Number of histogram bins (== histogram.length).
                        example: 6
                      histLo:
                        type: number
                        example: 0.1
                      histHi:
                        type: number
                        example: 0.25
                      histUnderflow:
                        type: integer
                        description: Finite values below histLo (not counted in any bin).
                        example: 0
                      histOverflow:
                        type: integer
                        description: Finite values above histHi (not counted in any bin).
                        example: 0
                      p10:
                        type: number
                        description: >-
                          Percentiles interpolated from the cumulative histogram
                          (only when `bins` was requested); approximate to
                          within one bin width, clamped to [minimum, maximum].
                        example: 0.12
                      p50:
                        type: number
                        example: 0.18
                      p90:
                        type: number
                        example: 0.23
                    required:
                      - valid
                      - count
                      - nullCount
                    additionalProperties: false
                  - title: where
                    type: object
                    properties:
                      valid:
                        type: boolean
                        description: false when no cell matched the predicate.
                        example: true
                      count:
                        type: integer
                        description: >-
                          Cells with value inside the inclusive [rangeLo,
                          rangeHi] predicate.
                        example: 3120
                      rangeLo:
                        type: number
                        example: 0.2
                      rangeHi:
                        type: number
                        example: 1
                      iMin:
                        type: integer
                        example: 12
                      iMax:
                        type: integer
                        example: 54
                      jMin:
                        type: integer
                        example: 8
                      jMax:
                        type: integer
                        example: 61
                      kMin:
                        type: integer
                        example: 3
                      kMax:
                        type: integer
                        example: 7
                      ci:
                        type: number
                        description: >-
                          I index of the ijk centroid (aim point) of the
                          matching cells.
                        example: 33.4
                      cj:
                        type: number
                        example: 34.1
                      ck:
                        type: number
                        example: 5.2
                    required:
                      - valid
                      - count
                    additionalProperties: false
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 401
                    maximum: 401
                    example: 401
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '406':
          description: Not acceptable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 406
                    maximum: 406
                    example: 406
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '410':
          description: >-
            The underlying ETP WebSocket session has been terminated by the ETP
            server. The transaction is no longer usable and must not be retried;
            clients should open a new transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    example: WEBSOCKET_SESSION_TERMINATED
                    description: >-
                      Stable machine-readable identifier for this error
                      condition.
                  description:
                    type: string
                    example: >-
                      ETP WebSocket session terminated (code 1011, reason:
                      Internal server error).
                  transactionId:
                    type: string
                    format: uuid
                    description: Transaction id that was terminated.
                  closeCode:
                    type: integer
                    format: int32
                    example: 1011
                    description: WebSocket close code reported by the ETP server.
                  closeReason:
                    type: string
                    description: WebSocket close reason reported by the ETP server.
                  terminatedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the session was terminated.
                  retryable:
                    type: boolean
                    example: false
                    description: >-
                      Always false. The transaction cannot be reused; open a new
                      one.
        '429':
          description: Too many request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 429
                    maximum: 429
                    example: 429
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '500':
          description: Unknown Error
          content:
            application/json:
              schema:
                type: object
