                    maxLength: 2048
        '406':
          description: Not acceptable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 406
                    maximum: 406
                    example: 406
                  message:
