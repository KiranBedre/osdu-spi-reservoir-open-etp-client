                      format: integer
                      maximum: 1000000
                      minimum: 0
                  Counts:
                    description: Number of index in a subarray (One value per dimension)
                    maxItems: 256
                    additionalProperties: false
                    type: array
                    items:
                      type: number
                      format: integer
                      maximum: 1000000
                      minimum: 0
                  ArrayType:
                    type: string
                    description: Type of arrays
                    enum:
                    - Int8Array
                    - Uint8Array
                    - Int16Array
                    - Int32Array
                    - BigInt64Array
                    - Uint16Array
                    - Uint32Array
                    - BigUint64Array
                    - Float32Array
                    - Float64Array
                    example: Int32Array
