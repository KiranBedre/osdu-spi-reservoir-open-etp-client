    get:
      description: >-
        Flat list of resources that reference this object (e.g., Properties
        attached to a Representation). Follows relationships backward (child →
        parent).


        **depth**: 1 = immediate sources only, N = recursive.


        **List vs graph**: Set `edges=true` to also return the relationship
        edges (equivalent to the deprecated `GET /graph/{type}/{guid}/sources`).
