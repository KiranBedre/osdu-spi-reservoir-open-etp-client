      tags:
        - Write
  /witsml/store:
    put:
      description: >-
        Store WITSML 2.1 (or 1.4.1 container) objects as ETP data objects.
        Provide the payload as `xml` or as a `json` array of Energistics objects
        (each with `$type` and `Uuid`). If no transactionId is provided,
        automatically wraps the write in a transaction (start → put → commit).


        **Key features**:

        - **XML or JSON input**: Send raw WITSML/EnergyML XML in `xml`, or an
        array of parsed objects in `json` (converted to XML server-side)

        - **WITSML 1.4.1 support**: Detects plural container wrappers
        (`<wells>`, `<logs>`, etc.) and splits into individual WITSML 2.1
        objects with deterministic UUID v5 from uid

        - **Channel data extraction**: Automatically extracts `<logData><data>`
        rows (1.4.1) or ChannelSet data (2.1) as separate ETP data arrays

        - **Trajectory support**: Extracts MD/Inclination/Azimuth from
        `<trajectoryStation>` elements as arrays

        - **Auto-transaction**: If no `transactionId` is provided, the write is
        wrapped in an internal transaction. If provided, the caller manages
        commit/rollback.
      operationId: WitsmlController_putWitsmlObjects
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          required: true
          schema:
            type: string
            example: osdu
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
