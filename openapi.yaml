    get:
      description: >-
        Retrieve the full content of a single data object by type and UUID.
        Returns Energistics XML by default, or JSON with `$format=json`.


        **JSON mode**: Adds `$type` annotations and converts XML attributes to
        JSON properties - useful for client-side processing without an XML
