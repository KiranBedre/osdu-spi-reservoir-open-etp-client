  /Reservoir/v2/dataspaces/{dataspaceId}/wells/markers:
    put:
      description: >-
        Build and write a WellboreMarkerFrameRepresentation with per-marker
        stratigraphy/FIRP linkage (reuse / OSDU-SRN masterdata / auto-create).
        Returns the representation UUID and the referenced interpretation UUIDs.
      operationId: WellWriteAPI_putMarkers
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        description: >-
          Wellbore marker-frame spec. Each marker's MD becomes a frame node; a
          boundary interpretation is reused (interpretationUuid), linked to OSDU
          masterdata (interpretationSrn/featureSrn), or auto-created from its
          title.
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - hdfUuid
                - trajectoryUuid
                - markers
              properties:
                title:
                  type: string
                  description: Citation title.
                uuid:
                  type: string
                  description: >-
                    WellboreMarkerFrameRepresentation Uuid (generated when
                    omitted).
                version:
                  type: string
                  enum:
                    - 2.0.1
                    - 2.2.0
                  description: RESQML version (default 2.0.1).
                hdfUuid:
                  type: string
                  description: >-
                    HDF proxy the node-MD array hangs off. Written automatically
                    when absent from the dataspace.
                trajectoryUuid:
                  type: string
                  description: Wellbore trajectory the markers are picked along.
                trajectoryType:
                  type: string
                  description: >-
                    Trajectory object type (default
                    obj_WellboreTrajectoryRepresentation).
                interpretationUuid:
                  type: string
                  description: WellboreInterpretation this frame represents (optional).
                interpretationType:
                  type: string
                interpretationSrn:
                  type: string
                  description: >-
                    OSDU SRN of the WellboreInterpretation (deterministic UUID
                    when no uuid).
                markers:
                  type: array
                  description: Marker picks (ordered by MD).
                  items:
                    type: object
                    required:
                      - md
                      - title
                    properties:
                      md:
                        type: number
                        description: Measured depth of the pick.
                      title:
                        type: string
                        description: Marker name / citation title.
                      boundaryKind:
                        type: string
                        enum:
                          - horizon
                          - fault
                          - geobody
                        description: Geologic boundary the marker picks.
                      domain:
                        type: string
                        enum:
                          - depth
                          - time
                        description: >-
                          Vertical domain of the auto-created interpretation
                          (default depth).
                      uuid:
                        type: string
                        description: Marker element Uuid (generated when omitted).
                      interpretationUuid:
                        type: string
                        description: Existing boundary interpretation to attach to.
                      featureUuid:
                        type: string
                        description: Existing feature (only with interpretationUuid).
                      interpretationSrn:
                        type: string
                        description: >-
                          OSDU SRN of the boundary interpretation (deterministic
                          UUID).
                      featureSrn:
                        type: string
                        description: OSDU SRN of the boundary feature (deterministic UUID).
                      interpretationTitle:
                        type: string
                        description: Title for the auto-created interpretation.
                      featureTitle:
                        type: string
                        description: Title for the auto-created feature.
                originator:
                  type: string
              example:
                title: Drogon markers — 55/33-1
                hdfUuid: d3f1a5c8-9e42-4b70-8a16-5c2e7f0b9d31
