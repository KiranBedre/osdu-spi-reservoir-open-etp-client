  /dataspaces/{dataspaceId}/epc/upload:
    post:
      description: >-
        Upload a RESQML EPC file (ZIP with XML objects) and an optional HDF5
        companion file.


        **Processing flow**:

        1. Validate file sizes against configured limits

        2. Unzip EPC → parse `[Content_Types].xml` manifest

        3. Extract XML objects, identify `EpcExternalPartReference` entries

        4. Scan XML for `<Hdf5Dataset>` blocks → collect H5 dataset paths

        5. Open H5 file, pre-scan dataset metadata

        6. Ensure dataspace exists (auto-create if needed)

        7. Start transaction (or reuse caller's)

        8. PUT objects in batches of 100 (avoids ETP message size limits)

        9. PUT arrays one-by-one from H5 file (bounded memory)

        10. Commit transaction

        11. Auto-ingest to OSDU catalog (if `autoIngest` is set)


        **Dataspace resolution**:

        - Use `/dataspaces/auto/epc/upload` to auto-generate the dataspace as
        `{username}/{epc_name}`

        - Override with `?dataspace=my/space` to use a specific name

        - The dataspace is auto-created if it doesn't exist


        **Auto-ingest modes**:

        - `false` (default) - no catalog registration

        - `true` / `records` - builds manifest → pushes records via Storage
        Service (data immediately searchable)

        - `workflow` - builds manifest → submits to OSDU ingestion workflow DAG


        **Note**: `autoIngest` requires an internal transaction (omit
        `transactionId`). When using an external transaction, auto-ingest is
        skipped because the data may not be committed yet.


        **Performance**: H5 file is written to disk (not buffered in memory).
        Arrays are read and sent one at a time. Duplicate H5 dataset references
        are deduplicated.
      operationId: EpcUploadAPI_uploadEpc
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: autoIngest
          required: false
          in: query
          description: >-
            When set, automatically builds an OSDU manifest after EPC ingest and
            pushes it to the OSDU catalog. Values: 'records' (default if set to
            'true') pushes records directly via Storage Service; 'workflow'
            submits the manifest to the OSDU ingestion workflow (Airflow DAG)
            for processing. Omit or set to 'false' to skip catalog registration
            (current default behavior).
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
              - records
              - workflow
            default: 'false'
        - name: registerMissingSchemas
          required: false
          in: query
          description: >-
            When set to 'true' together with `autoIngest`, any record whose OSDU
            `kind` has no schema registered on the target instance is guarded:
            RDDMS first attempts to register the schema (from a JSON file under
            `RDMS_SCHEMA_DIR` named `<entityType>:<version>.json`, e.g.
            `work-product-component--StructureMap:1.0.0.json`), and if no schema
            source is available the record is skipped and reported under
            `catalogIngestion.unsupportedKinds` so the rest of the manifest
            still ingests. Defaults to 'false' (unsupported kinds are still
            skipped and reported, but not registered).
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
            default: 'false'
        - name: validate
          required: false
          in: query
          description: >-
            When 'true', runs RESQML strict validation (XSD, DOR integrity,
            business rules) on the EPC before ingesting. If validation finds
            errors, the upload still proceeds but the response includes a
            `validation` report. Set to 'strict' to reject the upload on
            validation errors (returns 400).
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
              - strict
            default: 'false'
        - name: dataspace
          required: false
          in: query
          description: >-
            Override the dataspace from the URL path. When the path uses
            `dataspaceId=auto` (the recommended default), the dataspace is
            derived from `{username}/{epc_filename}`. Set this query parameter
            to use a specific dataspace instead (e.g.
            `?dataspace=myteam/project1`).
          schema:
            type: string
      requestBody:
        required: true
        description: >-
          EPC file (.epc) and optional HDF5 file (.h5). The EPC file is a ZIP
          archive containing RESQML/EML XML objects and a [Content_Types].xml
          manifest. The H5 file contains associated array data.
        content:
          multipart/form-data:
            schema:
              type: object
              required:
                - epc
              properties:
                epc:
                  type: string
                  format: binary
                  description: EPC file (ZIP archive)
                h5:
                  type: string
                  format: binary
                  description: HDF5 file (.h5) with array data
      responses:
        '200':
          description: Ingest result summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  objectsStored:
                    type: integer
                  arraysStored:
                    type: integer
                  skippedArrays:
                    type: integer
                  h5DataSize:
                    type: object
                    nullable: true
                    description: >-
                      Total H5 array data size (present when arrays were
                      uploaded)
                    properties:
                      elements:
                        type: integer
                        description: Total number of array elements
                      bytes:
                        type: integer
                        description: Total bytes to transfer
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        objectType:
                          type: string
                        uuid:
                          type: string
                        title:
                          type: string
                  warnings:
                    type: array
                    nullable: true
                    description: Diagnostic warnings collected during upload
                    items:
                      type: object
                      properties:
                        phase:
                          type: string
                          description: >-
                            Processing phase (extract, h5scan, h5open,
                            putArrays)
                        message:
                          type: string
                  timings:
                    type: object
                    description: Elapsed time per phase in milliseconds
                    properties:
                      unzip:
                        type: integer
                      extract:
                        type: integer
                      validate:
                        type: integer
                      h5scan:
                        type: integer
                      h5open:
                        type: integer
                      session:
                        type: integer
                      putObjects:
                        type: integer
                      putArrays:
                        type: integer
                      commit:
                        type: integer
                      autoIngest:
                        type: integer
                      total:
                        type: integer
                  catalogIngestion:
                    type: object
                    nullable: true
                    properties:
                      status:
                        type: string
                        enum:
                          - submitted
                          - completed
                          - failed
                          - skipped
                      mode:
                        type: string
                        enum:
                          - records
                          - workflow
                      recordCount:
                        type: integer
                      workflowRunId:
                        type: string
                      error:
                        type: string
                  validation:
                    type: object
                    nullable: true
                    description: >-
                      RESQML validation report (present when ?validate=true or
                      ?validate=strict)
                    properties:
                      is_valid:
                        type: boolean
                      version:
                        type: string
                        nullable: true
                      object_count:
                        type: integer
                      validated_count:
                        type: integer
                      error_count:
                        type: integer
                      warning_count:
                        type: integer
                      errors:
                        type: array
                        items:
                          type: object
        '400':
          description: Invalid EPC file or missing [Content_Types].xml
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 100
                    maximum: 511
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '406':
          description: Not acceptable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 406
                    maximum: 406
                    example: 406
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '410':
          description: >-
            The underlying ETP WebSocket session has been terminated by the ETP
            server. The transaction is no longer usable and must not be retried;
            clients should open a new transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    example: WEBSOCKET_SESSION_TERMINATED
                    description: >-
                      Stable machine-readable identifier for this error
                      condition.
                  description:
                    type: string
                    example: >-
                      ETP WebSocket session terminated (code 1011, reason:
                      Internal server error).
                  transactionId:
                    type: string
                    format: uuid
                    description: Transaction id that was terminated.
                  closeCode:
                    type: integer
                    format: int32
                    example: 1011
                    description: WebSocket close code reported by the ETP server.
                  closeReason:
                    type: string
                    description: WebSocket close reason reported by the ETP server.
                  terminatedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the session was terminated.
                  retryable:
                    type: boolean
                    example: false
                    description: >-
                      Always false. The transaction cannot be reused; open a new
