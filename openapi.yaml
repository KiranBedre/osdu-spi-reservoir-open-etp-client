  /dataspaces/{dataspaceId}/resources/arrays:
    put:
      description: >-
        Create or update a data array attached to an existing object (well log
        curves, grid properties, seismic traces, etc.).


        **Data formats**: Provide `Data` as a JSON number array or a
        base64-encoded string. For float arrays, JSON `null` values are
        converted to IEEE 754 NaN (standard missing-value representation).


        **Subarrays**: Include `Starts` and `Counts` to write a slice of an
        existing array. Both must be present together and match the `Dimensions`
        length.


        **Empty arrays**: Omit `Data` to create an empty array with the
        specified dimensions and type.


        **Chunking**: Large arrays (> ~10 MB) are automatically chunked by the
        ETP layer into multiple WebSocket messages.


        **Transaction**: Should be done within a transaction - pass
        `transactionId` from `POST /dataspaces/{ds}/transactions`.
      operationId: MutationsAPI_PutDataArray
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        description: JSON array of array information
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                type: object
                properties:
                  ContainerType:
                    type: string
                    description: Type of the array container
                    pattern: >-
                      ^(?<domainFamily>resqml|eml|witsml|prodml)(?<domainVersion>\d+).(?<dataType>(obj_)?\w+)$
                    example: eml20.obj_EpcExternalPartReference
                    maxLength: 256
                  ContainerUuid:
                    type: string
                    description: Type of the array container
                    pattern: >-
                      ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
                    maxLength: 256
                  PathInResource:
                    type: string
                    description: Path of the data array in the container
                    pattern: ^(\/?[\w-]+)+$
                    maxLength: 256
                  Dimensions:
                    description: Overall size of the entire array (One value per dimension)
                    maxItems: 256
                    type: array
                    items:
                      type: integer
                      format: int32
                      maximum: 1000000
                      minimum: 1
                  PreferredSubarrayDimensions:
                    description: Preferred size of an array size(One value per dimension)
                    maxItems: 256
                    type: array
                    items:
                      type: integer
                      format: int32
                      maximum: 1000000
                      minimum: 1
                  Data:
                    description: >-
                      Numerical values (as a JSON array of number or a base64
                      encoded string) or the subarray if starts and counts are
                      present
                    oneOf:
                      - type: array
                        maxItems: 1000
                        additionalProperties: false
                        items:
                          type: number
                          format: integer
                          minimum: 0
                          maximum: 1000000
                      - type: string
                        format: base64
                        maxLength: 10000000
                        pattern: >-
                          ^(?:[A-Za-z0-9+/]{4})*(?:[A-Za-z0-9+/]{2}==|[A-Za-z0-9+/]{3}=)?$
                  Starts:
                    description: First index of a subarray (One value per dimension)
                    maxItems: 256
                    additionalProperties: false
                    type: array
                    items:
                      type: number
                      format: integer
                      maximum: 1000000
                      minimum: 0
                  Counts:
                    description: Number of index in a subarray (One value per dimension)
                    maxItems: 256
                    additionalProperties: false
                    type: array
                    items:
                      type: number
                      format: integer
                      maximum: 1000000
                      minimum: 0
                  ArrayType:
                    type: string
                    description: Type of arrays
                    enum:
                      - Int8Array
                      - Uint8Array
                      - Int16Array
                      - Int32Array
                      - BigInt64Array
                      - Uint16Array
                      - Uint32Array
                      - BigUint64Array
                      - Float32Array
                      - Float64Array
                    example: Int32Array
                required:
                  - ContainerType
                  - ContainerUuid
                  - PathInResource
                  - Dimensions
                  - ArrayType
                additionalProperties: false
            examples:
              externalPartReference:
                value:
                  - ContainerType: eml20.obj_EpcExternalPartReference
                    ContainerUuid: 68f2a7d4-f7c1-4a75-95e9-3c6a7029fb23
                    PathInResource: /RESQML/5d27775e-5c7f-4786-a048-9a303fa1165a/points_patch0
                    Dimensions:
                      - 3
                      - 3
                    PreferredSubarrayDimensions:
                      - 3
                      - 1
                    Data:
                      - 0
                      - 0
                      - 0
                      - 1
                      - 1
                      - 1
                      - 2
                      - 2
                      - 2
                    ArrayType: Float32Array
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: 'Validation Failed: Invalid Range: Starts + Counts exceed Dimensions'
          content:
            application/json:
              schema:
                type: object
