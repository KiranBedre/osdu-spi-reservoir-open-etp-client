  /dataspaces/{dataspaceId}/clone:
    post:
      description: >-
        Create a copy of an existing dataspace with all its objects and arrays.
        Useful for creating scenario branches or snapshots.


        **Prerequisites**:

        - The source dataspace is automatically locked during the clone and
        unlocked afterwards.

        - The target dataspace (DataspaceId) must not already exist.


        **Object identity**: By default the clone is a server-side deep copy
        that **reuses the source object UUIDs**. The two dataspaces are
        independent stores, so editing the clone never affects the source — but
        the copied objects keep the *same identity* as the originals. That is
        fine for isolated sandbox/scenario work, but the shared UUIDs collide if
        the clone is later merged back or re-ingested into OSDU (the manifest
        builder derives each OSDU record id from the object UUID).


        **?reidentify** (default `false`): when set to `true`, after the copy
        every object in the clone is rewritten with brand new UUIDs, remapping
        the object's own identity, all of its Data Object References (DORs) and
        its array paths, and re-associating the arrays. Use `reidentify=true`
        when you need an independently publishable / re-ingestable copy. Leave
        it `false` (the default) for a fast snapshot that stays linked in
        identity to the source.


        **Note**: This is a server-side deep copy via ETP — no object or array
        data is transferred through the REST layer (re-identification streams
        array bytes through the gateway).
      operationId: DataspaceMutationsAPI_CloneDataspace
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: reidentify
          required: false
          in: query
          description: >-
            When true, mint new UUIDs for every object in the clone and remap
            all references/arrays so the copy is an independent, re-ingestable
            dataset. Defaults to false (the clone reuses the source object
            UUIDs).
          schema:
            type: boolean
      requestBody:
        required: true
        description: New Dataspace description
        content:
          application/json:
            schema:
              type: object
              properties:
                DataspaceId:
                  type: string
                  description: Name of dataspace
                  example: demo/Volve
                  maxLength: 2048
                  pattern: ^[^/]+(\/[^/]+)?$
                Path:
                  type: string
                  description: Path of dataspace
                  example: demo/Volve
                  maxLength: 2048
                  pattern: ^[^\r\n'"]+$
                CustomData:
                  type: object
                  description: Additional data
                  example:
                    key: value
                  additionalProperties:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
              required:
                - DataspaceId
              additionalProperties: false
            examples:
              New Scenario description:
                value:
                  DataspaceId: projectA/Scenario2
                  Path: projectA/Scenario2
                  CustomData:
                    viewers:
                      - data.default.viewers@osdu.example.com
                    owners:
                      - data.default.owners@osdu.example.com
                    legaltags:
                      - osdu-ReservoirDDMS-Legal-Tag
                    otherRelevantDataCountries:
                      - US
                      - UK
                    key: value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                maxLength: 2048
                pattern: >-
                  ^(?:eml:\/\/\/|^eml:\/\/\/dataspace\('[^'"]*?(?:''[^'"]*?)*'\))$
        '403':
          description: Forbidden
          content:
