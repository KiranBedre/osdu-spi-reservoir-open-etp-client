  /wells:
    get:
      description: >-
        Searches for wells (WITSML 2.1 Well or RESQML WellboreFeature) matching
        a name pattern across all accessible dataspaces (or a single specified
        dataspace). For each matching well, resolves child objects (wellbores,
        logs, trajectories, channelSets) via ETP relationship graph traversal.


        **Name pattern**: Use `*` as wildcard (e.g., `DROGON*` matches all wells
        starting with DROGON). Pattern matching is case-insensitive.


        **Performance note**: Searching all dataspaces iterates each one
        sequentially. Specify `dataspace` when you know where the wells reside.
      operationId: WellsController_findWells
      parameters:
        - name: name
          required: false
          in: query
          description: >-
            Well name pattern. Use * as wildcard (e.g., 'DROGON*', '*-1', '*').
            Case-insensitive. Defaults to '*' (all wells).
          schema:
            example: DROGON*
            type: string
        - name: dataspace
          required: false
          in: query
          description: >-
            Restrict search to a single dataspace path (e.g., 'test/drogon').
            Omit to search all dataspaces.
          schema:
            example: test/drogon
            type: string
        - name: include
          required: false
          in: query
          description: >-
            Comma-separated list of child types to resolve: logs, trajectories,
            channelSets. Omit to include all.
          schema:
            example: logs,trajectories
            type: string
      responses:
        '200':
          description: >-
            Array of wells, each with resolved child objects (wellbores always
            included; logs/trajectories/channelSets per `include`)
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                      example: 31/2-1
                    uuid:
                      type: string
                      example: a1b2c3d4-0000-0000-0000-000000000000
                    dataspace:
                      type: string
                      example: test/drogon
                    typeName:
                      type: string
                      example: witsml21.Well
                    wellbores:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                          typeName:
                            type: string
                          dataspace:
                            type: string
                    logs:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                          typeName:
                            type: string
                          dataspace:
                            type: string
                    trajectories:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                          typeName:
                            type: string
                          dataspace:
                            type: string
                    channelSets:
                      type: array
                      items:
                        type: object
                        properties:
                          uuid:
                            type: string
                          name:
                            type: string
                          typeName:
                            type: string
                          dataspace:
                            type: string
        '410':
          description: >-
            The underlying ETP WebSocket session has been terminated by the ETP
            server. The transaction is no longer usable and must not be retried;
            clients should open a new transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    example: WEBSOCKET_SESSION_TERMINATED
                    description: >-
                      Stable machine-readable identifier for this error
                      condition.
                  description:
                    type: string
                    example: >-
                      ETP WebSocket session terminated (code 1011, reason:
                      Internal server error).
                  transactionId:
                    type: string
                    format: uuid
                    description: Transaction id that was terminated.
                  closeCode:
                    type: integer
                    format: int32
                    example: 1011
                    description: WebSocket close code reported by the ETP server.
                  closeReason:
                    type: string
                    description: WebSocket close reason reported by the ETP server.
                  terminatedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the session was terminated.
                  retryable:
                    type: boolean
                    example: false
                    description: >-
                      Always false. The transaction cannot be reused; open a new
                      one.
      security:
        - HTTPBearer: []
      summary: Search wells across dataspaces with hierarchy resolution
      tags:
        - WITSML
