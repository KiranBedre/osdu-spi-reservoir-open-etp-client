  /Reservoir/v2/dataspaces/{dataspaceId}/arrays/compute:
    post:
      description: >-
        Evaluates one computation **inside the store** without transferring
        array bytes. Pick the operation with `op`:


        - `stats`: fixed-size summary (count, nulls, min/max/mean/stddev/sum) of
        `target`; add `rangeLo`/`rangeHi` for `inRangeCount` and `bins` for a
        histogram with p10/p50/p90.

        - `reduce`: collapse a 3-D property `[Nk, Nj, Ni]` over K into a 2-D
        column map with `reducer` (`sum`, `mean`, `min`, `max`, `count`, `net`),
        optionally inside a `[k0, k1)` K-zone. `count`/`net` need a value range;
        `net` multiplies by `cellDz`.

        - `where`: cells of `target` inside `[rangeLo, rangeHi]`: count,
        inclusive ijk bbox and ijk centroid.

        - `where-multi`: AND one predicate per property (`predicates`), or many
        predicate sets (`batches`, one result each); all arrays must share the
        grid shape.

        - `arith`: `C = op(A[, B | scalar])` written into the pre-declared
        writable array `arith.result` (see the `arith` schema for
        binary/scalar/unary forms).


        **async**: with `async: true` the request is queued and answered with
        202 and a job view; poll `GET /compute/jobs/{id}`, cancel with `DELETE`.
        Synchronous calls answer the result of the op directly (an array of
        results for `batches`).


        Returns 501 when the connected store does not implement the requested
        extension. The curl-friendly `GET
        .../resources/{type}/{guid}/arrays/{path}/compute?op=stats|where` route
        (under Resources) is a shortcut for the `stats`/`where` ops.
      operationId: ArrayComputeAPI_compute
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id
          schema:
