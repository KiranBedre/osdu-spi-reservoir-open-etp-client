  /dataspaces/{dataspaceId}/resources/{dataObjectType}/{guid}/arrays/{pathInResource}:
    get:
      description: >-
        Retrieve the numeric data of an array. For large arrays, use `starts`
        and `counts` to fetch slices (subarrays) instead of the full dataset.


        **starts/counts**: Must be used together. Each is a comma-separated list
        matching the array dimensions (e.g., `starts=0,0&counts=100,3` for first
        100 rows × 3 columns).


        **format**: `json` (default) returns a number array; `base64` returns a
        base64-encoded binary string (more efficient for large transfers).


        **Chunking**: The ETP layer automatically chunks large arrays (~10 MB
        per WebSocket message) and reassembles on the server side.
      operationId: DataArrayReadAPI_GetArray
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: dataObjectType
          required: true
          in: path
          description: Energistics type of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^(?<domainFamily>resqml|eml|witsml|prodml)(?<domainVersion>\d+).(?<dataType>(obj_)?\w+)$
            example: eml20.obj_EpcExternalPartReference
            type: string
        - name: guid
          required: true
          in: path
          description: Unique Id of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 53395ada-6f93-4bac-b506-d45997ded2a2
            type: string
        - name: pathInResource
          required: true
          in: path
          description: Identifier of the array inside the container.
          schema:
            maxLength: 2048
            pattern: ^(\/?[\w-]+)+$
            example: /RESQML/a3f31b20-c93a-4682-8f6c-71be087202a4/points_patch0
            type: string
        - name: version
          required: false
          in: query
          description: Optional version of the object
          schema:
            type: string
            pattern: ^[^']*?(?:''[^']*?)*$
            maxLength: 2048
        - name: starts
          required: false
          in: query
          description: When selecting a subarray, start of the slice in each dimension
          schema:
            type: array
            maxItems: 1000
            items:
              type: integer
              format: int32
              minimum: 0
              maximum: 1000000
        - name: counts
          required: false
          in: query
          description: When selecting a subarray, number of items in each dimension
          schema:
            type: array
            maxItems: 1000
            items:
              type: integer
              format: int32
              minimum: 1
              maximum: 1000000
        - name: format
          required: false
          in: query
          description: 'Representation of the array: JSON(default) or base64'
          schema:
            type: string
            enum:
              - json
              - base64
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
