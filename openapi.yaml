  /Reservoir/v2/query/resources/find:
    post:
      description: >-
        Search for resources below one or more URIs and return their metadata
        (URI, name, timestamps, relationship counts). Two switches extend the
        answer without a second round trip:


        - **includeContent**: also fetch every matched object's body (`data` +
        `format`), i.e. Discovery + GetDataObjects. Use for bulk export or OSDU
        Storage ingestion; prefer metadata only for large result sets.

        - **includeEdges**: also return the relationship `links` between the
        matched resources (a merged, deduplicated subgraph across all given
        `uri`s, traversed in both edge directions). Use for GraphQL-style deep
        search; split batches above ~100 URIs.


        **uri**: `eml:///dataspace('path/to/ds')` for a dataspace root, or
        object URI(s) to search below specific objects. A list of URIs is
        processed sequentially in a single ETP session; a URI that fails to
        traverse is skipped (best effort).


        **scope**: traversal direction - `targets` follows relationships forward
        (parent to child), `sources` backwards. **depth**: 1 = direct children,
        2+ = recursive, 0 = unlimited (caution).


        **modifiedSince**: ISO timestamp; only resources written after this time
        (incremental sync).


        **Server support**: uses ETP DiscoveryQuery (Protocol 13) when the store
        negotiates it and falls back to Discovery (Protocol 3) otherwise, so it
        works against every store.
      operationId: QueryController_findResources
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          required: true
          schema:
            type: string
            example: osdu
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FindResourcesDto'
      responses:
        '200':
          description: Matching resources; `links` only present when includeEdges is true
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        uri:
                          type: string
                        name:
                          type: string
                        sourceCount:
                          type: number
                        targetCount:
                          type: number
                        lastChanged:
