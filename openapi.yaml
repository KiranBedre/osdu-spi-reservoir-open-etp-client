                          example: '2022-01-12T07:22:00Z'
                          description: Creation date of the object.
                          maxLength: 2048
                        Format:
                          type: string
                          pattern: ^[^\r\n]+$
                          example: '[Vendor:Software:version]'
                          description: Identify the software that produces the object.
                          maxLength: 2048
                      additionalProperties: false
