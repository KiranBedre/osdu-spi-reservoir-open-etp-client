  /Reservoir/v2/dataspaces/{dataspaceId}/epc:
    get:
      description: >-
        Gather the requested objects (whole dataspace, or the `uuids` subset)
        plus every DOR-referenced child (CRS, HDF proxy, interpretations, …),
        pull their HDF5 arrays and return a self-contained `.epc` (OPC zip with
        an embedded HDF5 file) — the inverse of the EPC uploader.
      operationId: EpcDownloadController_downloadEpc
      parameters:
        - name: dataspaceId
          required: true
          in: path
          schema:
            type: string
        - name: uuids
          required: false
          in: query
          description: >-
            Comma-separated object UUIDs to seed the export. When omitted, the
            entire dataspace is exported.
          schema:
            type: string
        - name: includeReferences
          required: false
          in: query
          description: >-
            Follow DOR references and include all referenced children (default
            true).
          schema:
            type: string
      responses:
        '200':
          description: EPC package (application/epc+zip)
          content:
            application/epc+zip:
              schema:
                type: string
                format: binary
      security:
        - bearer: []
      summary: Download a dependency-closed EPC for a dataspace or object set
      tags:
        - Resources
  /Reservoir/v2/dataspaces/{dataspaceId}/resources/{dataObjectType}/{guid}/rdf:
    get:
      description: >-
        Returns the data object and its immediate relationships as linked data.
        Content-negotiated via the `Accept` header or the `format` query
        parameter (`turtle`, `jsonld`, `ntriples`, `csv`, `graphml`); defaults
        to Turtle.


        **depth**: 1 = the object and its direct neighbours (default), N =
        recursive traversal.
      operationId: ResourcesReadAPI_ObjectRdf
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: dataObjectType
          required: true
          in: path
          description: Energistics type of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^(?<domainFamily>resqml|eml|witsml|prodml)(?<domainVersion>\d+).(?<dataType>(obj_)?\w+)$
            example: resqml20.obj_ContinuousProperty
            type: string
        - name: guid
          required: true
          in: path
          description: Unique Id of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 1615d8d2-2a2d-482c-885e-14225b89e90c
            type: string
        - name: version
          required: false
          in: query
          description: Optional version of the object
          schema:
            type: string
            pattern: ^[^']*?(?:''[^']*?)*$
            maxLength: 2048
        - name: depth
          required: false
          in: query
          description: >-
            If present, indicate the number of recursive levels when looking for
            relations
          schema:
            type: number
            format: int32
            minimum: 1
            maximum: 1000
        - name: format
          required: false
          in: query
          description: >-
            Explicitly request a non-JSON serialization of the relationship
            graph, overriding the `Accept` header. RDF: `turtle`, `jsonld`,
            `ntriples`. Graph export: `csv` (node table), `graphml` (nodes +
            edges). Omit for the default JSON response.
          schema:
            type: string
            enum:
              - turtle
              - jsonld
              - ntriples
              - csv
              - graphml
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      responses:
        '200':
          description: RDF/graph projection of the data object
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 401
                    maximum: 401
                    example: 401
