              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: arrayMetadata
          required: false
          in: query
          description: >-
            If true, includes the content of referenced objects and includes the
            metadata of arrays such as size and type
          schema:
            type: boolean
            default: false
        - name: arrayValues
          required: false
          in: query
          description: >-
