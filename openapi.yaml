          schema:
            type: string
            pattern: ^((witsml|resqml|prodml|eml)[1-9]\d\.(obj_)?\w+,?)*$
            maxLength: 8192
        - name: depth
          required: false
          in: query
          description: >-
            If present, indicate the number of recursive levels when looking for
