  /Reservoir/v2/dataspaces/{dataspaceId}/seismic/{kind}:
    put:
      description: >-
        Build and write one seismic-domain RESQML object graph with the same
        builders the SDK uses, through the ETP write path (auto-opens a
        transaction unless `transactionId` is supplied). Returns the written
        UUIDs per kind: `bingrid` -> binGridUuid, interpretationUuid,
        featureUuid; `horizons` -> gridUuid or pointSetUuid, interpretationUuid,
        featureUuid (when created); `faults` -> representationUuid,
        interpretationUuid, featureUuid (when created); `velocity` -> uuid +
        kindResolution; `checkshots` -> uuids. Every response also carries the
        object/array counts committed.
      operationId: SeismicAPI_put
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: kind
          required: true
          in: path
          description: >-
            `bingrid` (P6/98 bin grid -> SeismicLatticeFeature +
            Grid2dRepresentation), `horizons` (Grid2dRepresentation or
            PointSetRepresentation + HorizonInterpretation), `faults`
            (PolylineSetRepresentation or PointSetRepresentation +
            FaultInterpretation), `velocity` (ContinuousProperty with a
            canonical velocity kind), `checkshots`
            (SeismicWellboreFrameRepresentation on 2.2/2.3, decomposed frame +
            time property on 2.0.x).
          schema:
            enum:
              - bingrid
              - horizons
              - faults
              - velocity
              - checkshots
            type: string
        - name: representation
          required: false
          in: query
          description: >-
            Carrier for `horizons` (`gridded` | `control-points`) and `faults`
            (`sticks` | `control-points`). Inferred from the body when omitted:
            `zValues` means gridded, `sticks` means sticks, `points` means
            control-points. Ignored for other kinds.
          schema:
            enum:
              - gridded
              - control-points
              - sticks
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: version
          required: false
          in: query
          description: >-
            RESQML version override for `checkshots` and `bingrid` (2.0.1 or
            2.2.0; unknown values are rejected with 400); falls back to the
            spec's `version`. Checkshots: 2.2 (EML 2.3) emits a native
            SeismicWellboreFrameRepresentation (full fidelity), 2.0.x decomposes
            to a WellboreFrame + time property (lossy). Bin grid: 2.0.x emit a
            Grid2dPatch + Offset lattice with scalar inline/crossline indices,
            2.2/2.3 an EML 2.3 Dimension lattice with
            InlineLabels/CrosslineLabels.
          schema:
            enum:
              - 2.0.1
              - 2.2.0
            type: string
      requestBody:
        required: true
        description: >-
          Spec for the selected `kind` (see the titled variants). Horizon and
          fault writes are FIRP-complete: the
          GeneticBoundaryFeature/TectonicBoundaryFeature + interpretation are
          created when `interpretationUuid` is omitted, and an
          `interpretationSrn`/`featureSrn` derives a deterministic UUID so a
          re-PUT upserts the same object.
        content:
          application/json:
            schema:
              oneOf:
                - title: bingrid
                  type: object
                  required:
                    - title
                    - crsUuid
                    - originEasting
                    - originNorthing
                    - binWidthOnIaxis
                    - binWidthOnJaxis
                    - bearingJaxisDeg
                    - firstInlineIndex
                    - inlineIndexIncrement
                    - firstCrosslineIndex
                    - crosslineIndexIncrement
                    - inlineBinCount
                    - crosslineBinCount
                  properties:
                    title:
                      type: string
                      description: Citation title.
                    uuid:
                      type: string
                      description: Grid2dRepresentation Uuid (generated when omitted).
                    version:
                      type: string
                      enum:
                        - 2.0.1
                        - 2.2.0
                      description: RESQML version (default 2.0.1).
                    crsUuid:
                      type: string
                      description: >-
                        CRS (LocalDepth3dCrs/LocalTime3dCrs) the origin/offsets
                        are expressed in.
                    crsType:
                      type: string
                      description: CRS object type; defaults from domain.
                    domain:
                      type: string
                      enum:
                        - depth
                        - time
                      description: Vertical domain (default depth).
                    originator:
                      type: string
                    originEasting:
                      type: number
                      description: P6BinGridOriginEasting.
                    originNorthing:
                      type: number
                      description: P6BinGridOriginNorthing.
                    originZ:
                      type: number
                      description: Vertical coordinate of the lattice origin (default 0).
                    binWidthOnIaxis:
                      type: number
                      description: P6BinWidthOnIaxis (inline bin width).
                    binWidthOnJaxis:
                      type: number
                      description: P6BinWidthOnJaxis (crossline bin width).
                    bearingJaxisDeg:
                      type: number
                      description: P6MapGridBearingOfBinGridJaxis (degrees).
                    bearingIaxisDeg:
                      type: number
                      description: I-axis bearing (deg); defaults to bearingJaxisDeg - 90.
                    firstInlineIndex:
                      type: integer
                      description: P6BinGridOriginI.
                    inlineIndexIncrement:
                      type: integer
                      description: P6BinNodeIncrementOnIaxis.
                    firstCrosslineIndex:
                      type: integer
                      description: P6BinGridOriginJ.
                    crosslineIndexIncrement:
                      type: integer
                      description: P6BinNodeIncrementOnJaxis.
                    inlineBinCount:
                      type: integer
                      description: Number of inline (I) bins; lattice nodes = this + 1.
                    crosslineBinCount:
                      type: integer
                      description: Number of crossline (J) bins; lattice nodes = this + 1.
                    featureUuid:
                      type: string
                      description: Reuse an existing SeismicLatticeFeature.
                    interpretationUuid:
                      type: string
                      description: Reuse an existing GenericFeatureInterpretation.
                    featureTitle:
                      type: string
                    interpretationTitle:
                      type: string
                  example:
                    title: Drogon 3D bin grid
                    crsUuid: 0e2b8d14-6f3a-4a5e-9c21-7f0b3d5e1a90
                    version: 2.0.1
                    domain: depth
                    featureTitle: Drogon 3D survey lattice
                    interpretationTitle: Drogon 3D bin grid interpretation
                    originEasting: 456000
                    originNorthing: 5930000
                    originZ: 0
                    binWidthOnIaxis: 25
                    binWidthOnJaxis: 12.5
                    bearingJaxisDeg: 30
                    firstInlineIndex: 100
                    inlineIndexIncrement: 1
                    firstCrosslineIndex: 200
                    crosslineIndexIncrement: 1
                    inlineBinCount: 20
                    crosslineBinCount: 40
                    originator: RDDMS Seismic API
                - title: horizons (gridded)
                  type: object
                  required:
                    - title
                    - hdfUuid
                    - crsUuid
                    - ni
                    - nj
                    - origin
                    - iSpacing
                    - jSpacing
                    - zValues
                  properties:
                    title:
                      type: string
                      description: Citation title.
                    uuid:
                      type: string
                      description: Grid2dRepresentation Uuid (generated when omitted).
                    version:
                      type: string
                      enum:
                        - 2.0.1
                        - 2.2.0
                      description: RESQML version (default 2.0.1).
                    hdfUuid:
                      type: string
                      description: >-
                        HDF proxy the Z array hangs off. Written automatically
                        when absent from the dataspace.
                    crsUuid:
                      type: string
                      description: CRS the lattice is expressed in.
                    crsType:
                      type: string
                      description: CRS object type (default obj_LocalDepth3dCrs).
                    domain:
                      type: string
                      enum:
                        - depth
                        - time
                      description: Vertical domain of the horizon (default time).
                    interpretationUuid:
                      type: string
                      description: >-
                        Existing HorizonInterpretation this grid represents
                        (else feature + interpretation are created).
                    interpretationType:
                      type: string
                    interpretationTitle:
                      type: string
                      description: Title for the auto-created HorizonInterpretation.
                    interpretationSrn:
                      type: string
                      description: >-
                        OSDU SRN of the interpretation. When no
