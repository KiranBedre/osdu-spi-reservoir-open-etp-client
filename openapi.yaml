        - name: $skip
          required: false
          in: query
          description: 'ODATA Pagination: Index of first item returned. [0..100000]'
          schema:
            type: number
            format: int32
            minimum: 0
            maximum: 100000
        - name: $top
          required: false
          in: query
          description: 'ODATA Pagination: Maximum number of items returned. [1..10000]'
          schema:
            type: number
            format: int32
            minimum: 1
            maximum: 10000
