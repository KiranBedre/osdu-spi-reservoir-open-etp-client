  /wells:
    get:
      description: 'Searches for wells (WITSML 2.1 Well or RESQML WellboreFeature) matching a name pattern across all accessible
        dataspaces (or a single specified dataspace). For each matching well, resolves child objects (wellbores, logs, trajectories,
        channelSets) via ETP relationship graph traversal.


        **Name pattern**: Use `*` as wildcard (e.g., `DROGON*` matches all wells starting with DROGON). Pattern matching is
        case-insensitive.


        **Performance note**: Searching all dataspaces iterates each one sequentially. Specify `dataspace` when you know where
        the wells reside.'
      operationId: WellsController_findWells
      parameters:
      - name: name
        required: true
        in: query
        description: Well name pattern. Use * as wildcard (e.g., 'DROGON*', '*-1', '*'). Case-insensitive.
        schema:
          example: DROGON*
          type: string
      - name: dataspace
        required: false
        in: query
        description: Restrict search to a single dataspace path (e.g., 'test/drogon'). Omit to search all dataspaces.
        schema:
          example: test/drogon
          type: string
      - name: include
        required: false
        in: query
        description: 'Comma-separated list of child types to resolve: logs, trajectories, channelSets. Omit to include all.'
        schema:
          example: logs,trajectories
          type: string
      responses:
        '200':
          description: Array of wells, each with resolved child objects (wellbores always included)
      security:
      - access-token: []
      servers:
      - url: /api/reservoir-ddms/v2
        description: API server
      summary: Search wells across dataspaces with hierarchy resolution
      tags:
      - Wells
