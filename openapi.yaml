        **Supported source domains**: RESQML 2.0.1 & 2.2, PRODML 2.3, WITSML
        2.1, EML 2.3. Use `GET /health/converters` to list all registered
        mappings.


        **Type filtering**: By DEFAULT a curated discovery set is emitted (M26
        behaviour): top-level types (features, interpretations, representations,
        stratigraphic columns, collections, WITSML 2.1) with only canonical
        (standard-named) properties and CRS always included. Two independent
        controls override this:

        - `typePatterns`: restrict/expand NON-property types. Pass `["*"]` to
        include EVERY type.

        - `propertyFilter`: `canonical` (default, only standard-named properties
        like PORO/PERMX/SW) | `none` (exclude properties) | `all` (every
        property).

        - `excludePatterns`: hard type exclusions. When omitted the default is
        property-aware - whenever `propertyFilter` is not `all` (e.g. the
        `canonical` default)
        `*Activity`/`*ActivityTemplate`/`*PropertySet`/`*WellboreFrameRepresentation`/`witsml21.Log`
        are excluded by default. Activity records reference every property they
        consumed (dangling once any property is dropped); well frames/logs
        convert to OSDU WellLog work-products, but wells are authoritative in
        the Wellbore DDMS and their curves stay searchable here in RDDMS, so a
        redundant OSDU copy is skipped (its orphaned curve properties are
        auto-suppressed to avoid dangling references). With
        `propertyFilter:"all"` nothing is dropped and Activities/wells are kept.
        Pass `[]` to opt out.


        To reproduce the M27 "everything" build, pass `typePatterns: ["*"]` and
        `propertyFilter: "all"` (this also retains Activities and wells). CRS
        objects are always included regardless of the filter.


        **Key behaviors**:

        - Best-effort mode - partial results returned on converter errors (check
        `errors[]` in response)

        - Auto-generates deterministic collaboration UUID (v5 from dataspace
        name)

        - Uses `OSDU_MILESTONE` env var (default M27) for OSDU schema versions

        - GridConnectionSet records report `HasTransmissibilityMultipliers` when
        attached transmissibility properties are found

        - WellLog records populate TopMeasuredDepth/BottomMeasuredDepth from
        frame index arrays

        - GenericProperty records populate `RealizationIndices` from the RESQML
        realisation-index join key: the scalar `RealizationIndex` (2.0.1 / 2.2)
        unioned with any inline `RealizationIndices` integer array (constant /
        range / lattice, resqml20 or eml23). HDF5-backed or multi-dimensional
        index arrays are left unresolved (and logged) rather than emitted as
        malformed values


        **createMissingReferences**: When true, creates placeholder records for
        unresolved data object references (DORs). When false, missing references
        appear in the error list.
      operationId: ObjectsManifestAPI_GetManifest
      parameters:
        - name: x-collaboration
          in: header
          description: >-
            Optional collaboration context forwarded to OSDU storage services
            (JSON string).
          required: false
          schema:
            type: string
        - name: data-partition-id
          in: header
          description: Data partition id
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ManifestInputDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ManifestDto'
        '202':
          description: >-
            Accepted (async:true). Body contains { jobId, status, statusUrl }.
            Poll GET /manifests/jobs/{jobId}.
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 401
                    maximum: 401
                    example: 401
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
