            maxItems: 1000
            items:
              type: integer
              format: int32
              minimum: 0
              maximum: 1000000
        - name: counts
          required: false
          in: query
          description: >-
            When selecting a subarray, number of items in each dimension. Use
            `-1` as a whole-dimension sentinel to take the remaining extent of
            that axis (e.g. `counts=-1,-1,1` for a single K-slab of an I×J×K
            grid property).
          schema:
            type: array
