    put:
      description: "Create new objects by providing their content as a JSON array.\n    Each JSON objects should conform to\
        \ the Energistics JSON schema defined for that type, including a $type field that is an Energistics qualified type\
        \ when needed.\n    Some extra metadata on the resource representing the object can added inside a _ResourceCustomData\
