      description: >-
        Build and write an EML 2.3 ColumnBasedTable (relative-permeability /
        capillary-pressure, PVT, facies). Each column binds a PropertyKind to an
        external value array. Returns the table UUID and the write summary.
      operationId: TableWriteAPI_putColumnBasedTable
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        description: >-
          Column-based table spec (KrPc / PVT / facies). ColumnBasedTable is an
          EML 2.3 object — use RESQML 2.2.0. Each column references a
          PropertyKind and stores its values in an external (HDF5) array.
        content:
          application/json:
            schema:
              type: object
              required:
                - title
                - hdfUuid
                - columns
              properties:
                title:
                  type: string
                  description: Citation title.
                uuid:
                  type: string
                  description: ColumnBasedTable Uuid (generated when omitted).
                version:
