          description: Unique Id of the object
          schema:
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
            example: 1615d8d2-2a2d-482c-885e-14225b89e90c
            type: string
        - name: version
          required: false
          in: query
          description: Optional version of the object
          schema:
            type: string
            pattern: ^[^']*?(?:''[^']*?)*$
            maxLength: 2048
        - name: $skip
          required: false
          in: query
          description: 'ODATA Pagination: Index of first item returned. [0..100000]'
          schema:
            type: number
            format: int32
            minimum: 0
            maximum: 100000
        - name: $top
          required: false
          in: query
          description: 'ODATA Pagination: Maximum number of items returned. [1..10000]'
          schema:
            type: number
            format: int32
            minimum: 1
            maximum: 10000
        - name: $filter
          required: false
          in: query
          description: ODATA filter using XPath syntax
          schema:
            type: string
            maxLength: 2048
            pattern: ^(?:(_data)|[0-9a-zA-Z /(),.]+|'.*')+$
        - name: storeLastWriteFilter
          required: false
          in: query
          description: >-
            If present, only the object modified after given date will be
            listed.
