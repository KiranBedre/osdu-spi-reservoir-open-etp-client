  /Reservoir/v2/dataspaces/{dataspaceId}/clone:
    post:
      description: >-
        Create a copy of an existing dataspace with all its objects and arrays.
        Useful for creating scenario branches or snapshots.


        **Prerequisites**:

        - The source dataspace is locked for the clone. Because the copy shares
        array data by reference, the store keeps the source locked for as long
        as the clone exists; unlock it (`DELETE /dataspaces/{id}/lock`) once the
        clone has been deleted.

        - The target dataspace (DataspaceId) must not already exist, unless
        `intoExisting=true`.


        **Object identity**: By default the clone is a server-side deep copy
        that **reuses the source object UUIDs**. The two dataspaces are
        independent stores, so editing the clone never affects the source - but
        the copied objects keep the *same identity* as the originals. That is
        fine for isolated sandbox/scenario work, but the shared UUIDs collide if
        the clone is later merged back or re-ingested into OSDU (the manifest
        builder derives each OSDU record id from the object UUID).


        **?reidentify** (default `false`): when set to `true`, after the copy
        every object in the clone is rewritten with brand new UUIDs, remapping
        the object's own identity, all of its Data Object References (DORs) and
        its array paths, and re-associating the arrays. Use `reidentify=true`
        when you need an independently publishable / re-ingestable copy. Leave
        it `false` (the default) for a fast snapshot that stays linked in
        identity to the source.


        **?intoExisting** (default `false`): when `true` the target dataspace
        `DataspaceId` must already exist and the source content is **imported
        into it** (objects keep their UUIDs, arrays are copied by reference,
        `Path`/`CustomData` of the body are ignored). The answer is then an
        object with the record count of the target instead of the bare target
        URI. `reidentify` is not supported together with `intoExisting`. Because
        the content is imported by reference, the server keeps the **source
        locked** for as long as the target exists; unlock it (`DELETE
        /dataspaces/{id}/lock`) after the target has been deleted.


        **Note**: This is a server-side deep copy via ETP - no object or array
        data is transferred through the REST layer (re-identification streams
        array bytes through the gateway).
      operationId: DataspaceMutationsAPI_CloneDataspace
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: reidentify
          required: false
          in: query
          description: >-
            When true, mint new UUIDs for every object in the clone and remap
            all references/arrays so the copy is an independent, re-ingestable
            dataset. Defaults to false (the clone reuses the source object
            UUIDs).
          schema:
            type: boolean
        - name: intoExisting
          required: false
          in: query
          description: >-
            When true, import the source content into the already existing
            dataspace named by DataspaceId instead of creating it. Defaults to
            false.
          schema:
            type: boolean
      requestBody:
        required: true
        description: New Dataspace description
        content:
          application/json:
            schema:
              type: object
              properties:
                DataspaceId:
                  type: string
                  description: Name of dataspace
                  example: demo/drogon
                  maxLength: 2048
                  pattern: ^[^/]+(\/[^/]+)?$
                Path:
                  type: string
                  description: Path of dataspace
                  example: demo/drogon
                  maxLength: 2048
                  pattern: ^[^\r\n'"]+$
                CustomData:
                  type: object
                  description: Additional data
                  example:
                    project: Drogon
                    discipline: Reservoir
                  additionalProperties:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
              required:
                - DataspaceId
              additionalProperties: false
            examples:
              New Scenario description:
                value:
                  DataspaceId: projectA/Scenario2
                  Path: projectA/Scenario2
                  CustomData:
                    viewers:
                      - data.default.viewers@osdu.example.com
                    owners:
                      - data.default.owners@osdu.example.com
                    legaltags:
                      - osdu-ReservoirDDMS-Legal-Tag
                    otherRelevantDataCountries:
                      - US
                      - UK
                    key: value
      responses:
        '200':
          description: >-
            Success: the new dataspace URI (string), or with intoExisting=true a
            summary object
          content:
            application/json:
              schema:
                oneOf:
                  - type: string
                    maxLength: 2048
                    pattern: >-
                      ^(?:eml:\/\/\/|^eml:\/\/\/dataspace\('[^'"]*?(?:''[^'"]*?)*'\))$
                  - type: object
                    properties:
                      status:
                        type: string
                        example: ok
                      sourceDataspace:
                        type: string
                        example: demo/drogon
                      targetDataspace:
                        type: string
                        example: sandbox/drogon-copy
                      recordCount:
                        type: integer
                        description: >-
                          Number of data objects in the target dataspace after
                          the copy
                        example: 346
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
