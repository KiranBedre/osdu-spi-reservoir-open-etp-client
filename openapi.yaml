  /dataspaces:
    post:
      description: Create new dataspaces.
      operationId: DataspaceMutationsAPI_PostDataspace
      parameters:
      - name: data-partition-id
        in: header
        description: Data partition id (ex. 'osdu')
        schema:
          type: string
          example: data-partition-id
          maxLength: 1048
          pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        description: JSON array of Dataspace description
        content:
          application/json:
            schema:
              type: array
              maxItems: 10000
              items:
                type: object
                properties:
                  DataspaceId:
                    type: string
                    description: Name of dataspace
                    example: demo/Volve
                    maxLength: 2048
                    pattern: ^[^/]+(\/[^/]+)?$
                  Path:
                    type: string
                    description: Path of dataspace
                    example: demo/Volve
                    maxLength: 2048
                    pattern: ^[^\r\n'"]+$
                  CustomData:
                    type: object
                    description: Additional data
                    example:
                      key: value
                    additionalProperties:
                      type: string
                      pattern: ^[a-zA-Z0-9 ]*$
                      maxLength: 2048
                required:
                - DataspaceId
                additionalProperties: false
            examples:
              new scenario description:
                value:
                - DataspaceId: projectA/Scenario1
                  Path: projectA/Scenario1
                  CustomData:
                    viewers:
                    - data.default.viewers@osdu.example.com
                    owners:
                    - data.default.owners@osdu.example.com
                    legaltags:
                    - osdu-ReservoirDDMS-Legal-Tag
                    otherRelevantDataCountries:
                    - US
                    - UK
                    key: value
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: array
                maxItems: 1000
                items:
                  type: string
                  maxLength: 2048
                  pattern: ^(?:eml:\/\/\/|^eml:\/\/\/dataspace\('[^'"]*?(?:''[^'"]*?)*'\))$
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '406':
          description: Not acceptable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 406
                    maximum: 406
                    example: 406
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '410':
          description: The underlying ETP WebSocket session has been terminated by the ETP server. The transaction is no longer
            usable and must not be retried; clients should open a new transaction.
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  code:
                    type: string
                    example: WEBSOCKET_SESSION_TERMINATED
                    description: Stable machine-readable identifier for this error condition.
                  description:
                    type: string
                    example: 'ETP WebSocket session terminated (code 1011, reason: Internal server error).'
                  transactionId:
                    type: string
                    format: uuid
                    description: Transaction id that was terminated.
                  closeCode:
                    type: integer
                    format: int32
                    example: 1011
                    description: WebSocket close code reported by the ETP server.
                  closeReason:
                    type: string
                    description: WebSocket close reason reported by the ETP server.
                  terminatedAt:
                    type: string
                    format: date-time
                    description: ISO-8601 timestamp when the session was terminated.
                  retryable:
                    type: boolean
                    example: false
                    description: Always false. The transaction cannot be reused; open a new one.
        '429':
          description: Too many request
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 429
                    maximum: 429
                    example: 429
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '500':
          description: Unknown Error
