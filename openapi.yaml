        '406':
          description: Not acceptable response
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 406
                    maximum: 406
                    example: 406
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '410':
          description: >-
            The underlying ETP WebSocket session has been terminated by the ETP
            server. The transaction is no longer usable and must not be retried;
            clients should open a new transaction.
          content:
            application/json:
              schema:
                type: object
