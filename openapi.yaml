  /Reservoir/v2/seismic/validate:
    post:
      description: >-
        Canonicalises each seismic property kind against the vocabulary
        (resolving common aliases such as 'AI', 'RMS', 'TWT') and checks any
        supplied UOM. Use as an ingest-time choke-point before seismic
        properties land as RESQML objects.
      operationId: SeismicValidateController_validate
      parameters:
        - name: strict
          required: false
          in: query
          description: >-
            When true, reject (422) if any kind is non-canonical instead of
            warning
          schema:
            type: boolean
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SeismicValidationRequestDto'
      responses:
        '200':
          description: Validation results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SeismicValidationResponseDto'
        '422':
          description: One or more kinds are non-canonical (strict mode)
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 422
                    maximum: 422
                    example: 422
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        default:
          description: Unknown Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 500
                    maximum: 500
                    example: 500
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
      security: []
      summary: Validate seismic property kinds
      tags:
        - Seismic
  /Reservoir/v2/dataspaces/{dataspaceId}/grids:
    put:
      description: >-
        Parse an ASCII corner-point deck (COORD/ZCORN/ACTNUM), synthesise split
        coordinate lines for faults (full split-fault pillar-grid fidelity),
        create a fresh HDF proxy and write the IjkGridRepresentation + geometry
        arrays.
      operationId: GridAPI_importGrdecl
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          schema:
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: format
          required: false
          in: query
          description: >-
            Input deck format (default `grdecl`). Only `grdecl` is currently
            supported; the flag reserves this single path for future binary
            (egrid/init) import without a new route.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrdeclImportDto'
      responses:
        '200':
          description: ''
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '500':
          description: Unknown Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 500
                    maximum: 500
                    example: 500
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
      security:
        - HTTPBearer: []
      summary: Import a reservoir grid from an OPM/GRDECL deck
      tags:
        - Reservoir
  /Reservoir/v2/dataspaces/{dataspaceId}/grids/{uuid}/export:
    get:
      description: >-
        Read the coordinate-line node array (+ split-line indexing when
        faulted), decode to a neutral corner-point grid and serialise it in the
        requested `format`:

        • **grdecl** — ASCII SPECGRID/COORD/ZCORN/ACTNUM deck (`text/plain`);
        ACTNUM and cell properties on demand via the flags. Consumed by OPM /
        `xtgeo.grid_from_file`.

        • **egrid** — binary EGRID geometry + ACTNUM (big-endian,
        Fortran-unformatted); ~3–4× smaller than grdecl with no text parse. Read
        by resdata, OPM, `xtgeo.grid_from_file(fileformat='egrid')`.

        • **init** — binary INIT static properties (companion to egrid); each
        ContinuousProperty becomes an active-cell keyword (`PORV` global). Read
        by resdata (`EclInitFile`) /
        `xtgeo.gridproperty_from_file(fileformat='init')`.
      operationId: GridAPI_exportGrid
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          schema:
            type: string
        - name: uuid
          required: true
          in: path
          schema:
            type: string
        - name: format
          required: false
          in: query
          description: >-
            Output format: `grdecl` (ASCII deck, default), `egrid` (binary
            geometry) or `init` (binary static properties). Replaces the former
            `/grdecl`, `/egrid` and `/init` sub-paths.
          schema:
            type: string
        - name: version
          required: false
          in: query
          description: RESQML version of the source grid (default 2.0.1)
          schema:
            type: string
        - name: actnum
          required: false
          in: query
          description: >-
            `grdecl` only: include the ACTNUM keyword (reads the grid's
            active-cell property). Default false. (`egrid`/`init` always carry
            ACTNUM.)
          schema:
            type: string
        - name: properties
          required: false
          in: query
          description: >-
            `grdecl`: set truthy to include every cell property keyword
            (PORO/PERMX…). `init`: comma-separated keyword names to include
            (case-insensitive; omit for every ContinuousProperty). Ignored for
            `egrid`.
          schema:
            type: string
        - name: geometry
          required: false
          in: query
          description: >-
            `grdecl` only: emit SPECGRID/COORD/ZCORN geometry. Default true; set
            false with actnum/properties to export a properties-only deck.
          schema:
            type: string
      responses:
        '200':
          description: GRDECL text (`grdecl`) or a binary EGRID/INIT file (`egrid`/`init`)
          content:
            text/plain:
              schema:
                type: string
            application/octet-stream:
              schema:
                type: string
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Grid not found
        '500':
          description: Grid geometry could not be decoded
      security:
        - HTTPBearer: []
      summary: Export a RESQML IJK grid as an OPM/GRDECL deck (grdecl | egrid | init)
      tags:
        - Reservoir
  /Reservoir/v2/dataspaces/{dataspaceId}/reservoir/{kind}:
    put:
      description: >-
        Dataspace-level organisation interpretations that are tedious to
        assemble by hand (a feature + one interpretation per unit/boundary + the
        organisation that lists them). Written through the ETP write path;
        auto-opens a transaction unless `transactionId` is supplied.
        Representations that reference grids (GridConnectionSet,
        BlockedWellbore, IntervalStratigraphicUnits, CellFluidPhaseUnits, region
        properties) are written with the generic `PUT /resources` + `PUT
        /resources/arrays` routes or the SDK builders.


        **zones**: Create a stratigraphic zonation (zones). Writes a
        StratigraphicColumnRankInterpretation ordering N stratigraphic units
        (zones), each with its own StratigraphicUnitFeature +
        StratigraphicUnitInterpretation, plus an OrganizationFeature and
        (optionally) a top-level StratigraphicColumn. Fully RESQML 2.0.1-native;
        the returned rank UUID can drive a grid's IntervalStratigraphicUnits.


        **fluid-model**: Create a multi-region rock-fluid organisation
        (fluid-in-place model). Writes a genuine multi-region rock-fluid
        organisation: a `Model` organisation feature, a `RockVolumeFeature` +
        phase-tagged `RockFluidUnitInterpretation` per fluid unit, an optional
        `BoundaryFeature` + `FluidBoundaryInterpretation` per fluid contact (GOC
        / WOC / FWL …), and the `RockFluidOrganizationInterpretation` that lists
        every unit. Requires RESQML 2.2+ (unbounded units); RESQML 2.0.1 caps
        the organisation at a single unit. The returned `orgUuid` can drive a
        grid's `CellFluidPhaseUnits` (SDK `buildCellFluidPhaseUnits` or a
        generic `PUT /resources`).
      operationId: GridAPI_putReservoirObject
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Dataspace id (URL-encoded, e.g. demo%2FVolve)
          schema:
            type: string
        - name: kind
          required: true
          in: path
          description: >-
            `zones` (StratigraphicColumnRankInterpretation + units),
            `fluid-model` (RockFluidOrganizationInterpretation + units).
          schema:
            enum:
              - zones
              - fluid-model
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        description: Spec for the selected `kind` (titled variants below).
        content:
          application/json:
            schema:
              oneOf:
                - title: zones
                  $ref: '#/components/schemas/StratigraphicColumnDto'
                - title: fluid-model
                  $ref: '#/components/schemas/RockFluidModelDto'
      responses:
        '200':
          description: Object written; shape depends on `kind`.
          content:
            application/json:
              schema:
                oneOf:
                  - title: zones
                    type: object
                    properties:
                      rankUuid:
                        type: string
                      featureUuid:
                        type: string
                      columnUuid:
                        type: string
                      unitInterpretationUuids:
                        type: array
                        items:
                          type: string
                      objects:
                        type: number
                      arrays:
                        type: number
                  - title: fluid-model
                    type: object
                    properties:
                      orgUuid:
                        type: string
                      orgFeatureUuid:
                        type: string
                      unitInterpretationUuids:
                        type: array
                        items:
                          type: string
                      boundaryInterpretationUuids:
                        type: array
                        items:
                          type: string
                      objects:
                        type: number
                      arrays:
                        type: number
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '500':
          description: Unknown Error
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 500
                    maximum: 500
                    example: 500
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
      security:
        - HTTPBearer: []
      summary: Put a reservoir framework interpretation (zones | fluid-model)
      tags:
        - Reservoir
  /Reservoir/v2/dataspaces/grid-property-mappings:
    get:
      description: >-
        Returns the bidirectional registry that bridges GRDECL/EGRID/INIT
        keywords, RESQML property kinds, and OSDU canonical names (with units).
        This drives both GRDECL/INIT import (keyword → RESQML kind+UOM) and
        export (RESQML Title → keyword). Extend or override it at runtime with
        `POST grid-property-mappings`.
      operationId: GridAPI_listGridPropertyMappings
      parameters:
        - name: data-partition-id
          in: header
