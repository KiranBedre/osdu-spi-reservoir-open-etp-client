                    type: object
                    properties:
                      Title:
                        type: string
                        pattern: ^[^\r\n]+$
                        example: My Grid
                        description: User friendly name of the object.
                        maxLength: 2048
                      Originator:
                        type: string
                        pattern: ^[^\r\n]+$
