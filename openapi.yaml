  /dataspaces/{dataspaceId}/epc/upload:
    post:
      description: "Upload a RESQML EPC file (ZIP with XML objects) and an optional HDF5 companion file.\n  The endpoint unzips\
        \ the EPC, parses all XML objects from [Content_Types].xml, reads referenced array data\n  from the H5 file, and ingests\
        \ everything into the target dataspace within a transaction.\n  If no transactionId is provided, an internal transaction\
        \ is created and committed automatically.\n  If transactionId is provided, the caller is responsible for commit/rollback."
      operationId: EpcUploadAPI_UploadEpc
      parameters:
      - name: data-partition-id
        in: header
        description: Data partition id (ex. 'osdu')
        schema:
          type: string
          example: data-partition-id
          maxLength: 1048
          pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      - name: dataspaceId
        required: true
        in: path
        description: Name of dataspace
        schema:
          maxLength: 2048
          pattern: ^[^/]+(\/[^/]+)?$
          example: demo/Volve
          type: string
      - name: transactionId
        required: false
        in: query
        description: Identify current transaction. If omitted, an internal transaction is created and committed automatically.
        schema:
          type: string
          maxLength: 2048
          pattern: ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        description: EPC file (.epc) and optional HDF5 file (.h5)
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - epc
              properties:
                epc:
                  type: string
                  format: binary
                  description: EPC file (ZIP archive containing RESQML/EML XML objects and [Content_Types].xml)
                h5:
                  type: string
                  format: binary
                  description: HDF5 file (.h5) with associated array data
      responses:
        '200':
          description: Ingest result summary
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  objectsStored:
                    type: integer
                    example: 12
                    description: Number of XML objects ingested
                  arraysStored:
                    type: integer
                    example: 5
                    description: Number of HDF5 arrays ingested
                  skippedArrays:
                    type: integer
                    example: 0
                    description: Number of arrays skipped (e.g., missing datasets)
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        objectType:
                          type: string
                          example: resqml20.obj_IjkGridRepresentation
