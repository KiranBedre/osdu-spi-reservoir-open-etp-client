  /query/graph/search:
    post:
      description: >-
        Build a merged, deduplicated subgraph for multiple resource URIs in a
        single ETP session.


        For each URI, traverses the relationship graph with the given scope and
        depth, then merges all discovered nodes and edges into a single result.


        **Why use this**: Without batch search, deep search across N objects
        requires N+ individual REST calls. This endpoint does it in one call,
        reusing a single ETP session.


        **Performance**: For very large batches (>100 URIs), split into chunks -
        URIs are processed sequentially within the session. Depth values > 100
        may timeout depending on server configuration.


        **Best-effort**: If traversal fails for one URI, remaining URIs are
        still processed and partial results returned.
      operationId: QueryController_graphSearch
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          required: true
          schema:
            type: string
            example: osdu
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GraphSearchDto'
      responses:
        '200':
          description: Merged graph containing all discovered resources and edges
          content:
            application/json:
              schema:
                type: object
                properties:
                  resources:
                    type: array
                    items:
                      type: object
                      properties:
                        uri:
                          type: string
                        name:
                          type: string
                        sourceCount:
                          type: number
                        targetCount:
                          type: number
                        lastChanged:
