                        uuid:
                          type: string
                          example: 2b8f1c5e-9d34-4a7e-b016-7c3e5f0a9d21
                        title:
                          type: string
                          example: 55/33-1
                  arraysStored:
                    type: integer
                    description: >-
                      Number of channel/trajectory data arrays extracted and
                      stored
                    example: 0
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 401
                    maximum: 401
                    example: 401
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
