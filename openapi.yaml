                    name:
                      type: string
                      description: Resource title
                      example: Depth_Hugin_Fm_Top_t
                      maxLength: 2048
                      pattern: ^[^\r\n]+$
                    sourceCount:
                      type: number
                      description: Number of objects referencing the resource
                      format: integer
                      minimum: 0
                      maximum: 1000000
                    targetCount:
                      type: number
                      description: Number of objects referenced by the resource
                      format: integer
                      minimum: 0
                      maximum: 1000000
                    activeStatus:
