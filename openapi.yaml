  /Reservoir/v2/cypher:
    post:
      description: >-
        Evaluate graph-pattern queries against the RESQML/ETP property graph.
        This is the relationship-centric companion to the field-selection
        `/graphql` endpoint: use **Cypher** for connectivity, lineage,
        provenance and topology ("what is connected to what?"), and **GraphQL**
        for record/field retrieval.


        **Data model**

        - **Nodes** = RESQML resources (Features, Interpretations,
        Representations, Grids, Properties, Wellbores…).

        - **Relationships** = DataObjectReferences (DORs). The semantic role is
        inferred from the RESQML tier chain (`InterpretedFeature`,
        `RepresentedInterpretation`, `SupportingRepresentation`).

        - **Labels** match the data-object type by substring, so `(:Grid)`,
        `(:Interpretation)`, `(:Wellbore)` and the fully-qualified
        `(:resqml20.obj_IjkGridRepresentation)` all work.

        - **Relationship types** map onto inferred roles via synonyms (e.g.
        `INTERPRETED_BY` ⇄ `RepresentedInterpretation`); unknown roles match
        leniently.


        **Supported grammar (bounded, Neptune/Spanner-style strict subset)**

        ```

        MATCH <pattern> [WHERE <expr>] RETURN <items> [ORDER BY …(ignored)]
        [SKIP n] [LIMIT n]

        ```

        - Node: `(var:Label {prop: value})` — property keys: `uri`, `id`/`uuid`,
        `name`, `type`.

        - Relationship: `-[:TYPE|OTHER *min..max]->`, `<-[...]-`, or undirected
        `-[...]-`.

        - Variable-length `*1..10` paths (capped at 10 hops).

        - WHERE: `=, <>, <, <=, >, >=, =~, CONTAINS, STARTS WITH, ENDS WITH, IS
        NULL`, combined with `AND`/`OR`/`NOT`.

        - RETURN: node variables, `var.prop`, path variables, `AS` aliases,
        `DISTINCT`.


        **Not supported** (rejected with HTTP 400): writes
        (`CREATE/MERGE/SET/DELETE`), `WITH`, `UNWIND`, `CALL`, `OPTIONAL MATCH`,
        aggregations. Array-cell predicates (e.g. porosity > 0.3) are not
        expressible in a pattern — use the GraphQL `stats`/`reduce`/`where`
        fields for those.


        **Examples**

        ```cypher

        // Everything within 5 hops of a grid

        MATCH p = (g:IjkGridRepresentation {id: $gridId})-[*1..5]-(x)

        RETURN p


        // Lineage: objects feeding an interpretation chain

        MATCH
        (f:Feature)<-[:InterpretedFeature]-(i:Interpretation)<-[:RepresentedInterpretation]-(r)

        RETURN f, i, r


        // Properties supported by a grid

        MATCH (g:Grid)-[:SupportingRepresentation]-(p:Property)

        RETURN g.name, p.name AS property

        ```
      operationId: CypherController_runCypher
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          required: true
          schema:
            type: string
            example: osdu
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CypherQueryDto'
      responses:
        '200':
          description: >-
            Tabular result set. `columns` lists the RETURN aliases; `data` holds
            one object per matched row keyed by alias (node values are expanded
            to `{uri,id,name,type,...}`). `stats` reports the scanned subgraph
            size.
          content:
            application/json:
              schema:
                type: object
                properties:
                  columns:
                    type: array
                    items:
                      type: string
                    example:
                      - g.name
                      - property
                  data:
                    type: array
                    items:
                      type: object
                      additionalProperties: true
                    example:
                      - g.name: Drogon Depth Ijk Grid
                        property: Porosity
                  stats:
                    type: object
                    properties:
                      nodesScanned:
                        type: number
                        example: 128
                      edges:
                        type: number
                        example: 214
                      rowsBeforeLimit:
                        type: number
                        example: 7
                      graphDepth:
