  /dataspaces/{dataspaceId}/resources:
    put:
      description: >-
        Create new objects or replace existing ones by providing their content
        as a JSON array.


        Each object must conform to the Energistics JSON schema for its type and
        include:

        - `$type` - Energistics qualified type (e.g.,
        `resqml20.obj_IjkGridRepresentation`)

        - `Uuid` - unique identifier

        - `Citation` - with at least `Title`, `Originator`, and `Creation`


        **Transaction**: Pass `transactionId` to write within a transaction
        (recommended). Without it, operates in auto-commit mode.


        **Custom metadata**: Include a `_ResourceCustomData` field (JSON
        key-value object) to attach extra metadata to the ETP resource.


        **Batch size**: Objects are sent to the ETP server in batches. For very
        large payloads (>100 objects), consider splitting across multiple calls
        within the same transaction.
      operationId: MutationsAPI_PutDataObject
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        - name: validate
          required: false
          in: query
          description: >-
            When 'true', runs RESQML validation (XSD, DOR integrity, business
            rules) on the objects before writing. The write still proceeds but
            the response includes a `validation` report. Set to 'strict' to
            reject the write on validation errors (returns 400).
          schema:
            type: string
            enum:
              - 'false'
              - 'true'
              - strict
            default: 'false'
