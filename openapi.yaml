  /dataspaces/{dataspaceId}/graph/all:
    get:
      deprecated: true
      description: >-
        **Deprecated** — use `GET /dataspaces/{id}/resources/all?edges=true`
        instead, which returns the same nodes-and-edges graph. This route
        remains for M26 backward compatibility.


        Build a complete relationship graph for all resources in a dataspace.
        Returns nodes and edges (relationships between objects).


        **Linked data**: Send `Accept: text/turtle` or `Accept:
        application/ld+json` to receive the graph as RDF.


        **depth**: 1 = direct relationships only, N = recursive traversal.
        Higher values may be slow for large dataspaces.
      operationId: ResourcesReadAPI_GraphResources
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
        - name: $skip
          required: false
          in: query
          description: 'ODATA Pagination: Index of first item returned. [0..100000]'
          schema:
            type: number
            format: integer
            minimum: 0
            maximum: 100000
        - name: $top
          required: false
          in: query
          description: 'ODATA Pagination: Maximum number of items returned. [1..10000]'
          schema:
            type: number
            format: integer
            minimum: 1
            maximum: 10000
        - name: $filter
          required: false
          in: query
          description: ODATA filter using XPath syntax
          schema:
            type: string
            maxLength: 2048
            pattern: ^(?:(_data)|[0-9a-zA-Z /(),.]+|'.*')+$
        - name: storeLastWriteFilter
          required: false
          in: query
          description: >-
            If present, only the object modified after given date will be
            listed.
