                        pattern: ^[^\r\n]+$
                        example: '[Vendor:Software:version]'
                        description: Identify the software that produces the object.
                        maxLength: 2048
                    additionalProperties: false
                required:
                - Uuid
                - $type
                - SchemaVersion
