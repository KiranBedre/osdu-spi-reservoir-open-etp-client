          schema:
            type: string
            pattern: ^[^']*?(?:''[^']*?)*$
            maxLength: 2048
        - name: $format
          required: false
          in: query
          description: Expected return format
          schema:
            type: string
            enum:
              - xml
              - json
            default: json
        - name: transactionId
          required: false
          in: query
          description: Identify current transaction
          schema:
            type: string
            maxLength: 2048
