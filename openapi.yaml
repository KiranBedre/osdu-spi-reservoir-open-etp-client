                          no uuid).
                      title:
                        type: string
                        description: Column title (defaults to the property-kind name).
                      uom:
                        type: string
                        description: UOM override; defaults to the PropertyKind UOM.
                      valueCountPerRow:
                        type: integer
                        description: >-
                          Values per row (fastest array dimension when > 1).
                          Default 1.
                      values:
                        type: array
                        items:
                          type: number
                        description: Column values, row-major.
                originator:
                  type: string
              example:
                title: Drogon KrPc — Volantis drainage
                hdfUuid: d3f1a5c8-9e42-4b70-8a16-5c2e7f0b9d31
