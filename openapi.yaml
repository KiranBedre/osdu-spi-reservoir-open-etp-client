  /witsml/query:
    post:
      description: >-
        Retrieves WITSML 2.1 / EnergyML objects from a dataspace, returning the
        full content of each.


        **Format**: Set `format` to `xml` (raw Energistics XML, default) or
        `json` (parsed object).


        **Filters** (all optional, combinable):

        - `objectType` / `objectTypes` - restrict to one or several type names
        (Well, Wellbore, WellLog, ...)

        - `titleContains` - case-insensitive substring match on the title/name

        - `uuids` - return only a specific set of objects

        - `modifiedSince` - ISO timestamp for incremental sync

        - `relatedTo` + `scope` - traverse relationships from a given object
        (e.g. all Wellbores/Logs under a Well) using a bare UUID or full ETP URI

        - `skip` / `top` - pagination


        The response includes `total` (matches before pagination) and `count`
        (returned in this page).


        **Note**: For metadata-only listing, use the generic `GET
        /dataspaces/{dataspaceId}/resources/all` endpoint instead.
      operationId: WitsmlController_queryWitsmlObjects
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          required: true
          schema:
            type: string
            example: osdu
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: $format
          required: false
          in: query
          description: >-
            Output encoding; overrides the body `format` field. `xml` (default)
            returns raw Energistics XML in each object's `xml`; `json` returns
            the parsed object in `content`.
          schema:
            enum:
              - xml
              - json
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WitsmlQueryDto'
      responses:
        '200':
          description: >-
            Paged object array plus count (this page) and total (all matches
            before pagination)
          content:
            application/json:
              schema:
                type: object
                properties:
                  objects:
                    type: array
                    items:
                      type: object
                      properties:
                        uri:
                          type: string
                          example: >-
                            eml:///dataspace('test/witsml')/witsml21.Well(a1b2c3d4-...)
