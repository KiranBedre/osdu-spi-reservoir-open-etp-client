  /Reservoir/v2/dataspaces/{dataspaceId}/log-structure/align:
    post:
      description: >-
        Reads the shared index array (typically a WellboreFrame `NodeMd`) and
        each curve, then joins them into one sample matrix. Curves on the same
        frame are aligned without resampling (node-for-node column-bind); curves
        on a different frame are linearly interpolated onto the shared index and
        marked `resampled`. The `:dataspaceId` is the only route anchor; all
        object references live in the body.
      operationId: LogStructureAPI_Align
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/drogon
            type: string
        - name: transactionId
          required: false
          in: query
          description: >-
            Identify current transaction. Requires authenticated credentials for
            the creating principal and data partition.
          schema:
            type: string
            maxLength: 2048
            pattern: >-
              ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlignRequestDto'
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                    example: GR
                  resampled:
                    type: boolean
                    description: >-
                      true when the curve was linearly interpolated onto the
                      shared index (it was sampled on a different frame); false
                      for a direct column-bind.
                    example: false
                  data:
                    type: array
                    description: The curve values at each shared-index sample.
                    items:
                      type: number
                required:
                  - name
                  - resampled
                  - data
                additionalProperties: false
      security:
        - bearer: []
      summary: Co-index curves onto a shared index axis
      tags:
        - Well
  /Reservoir/v2/pwls/resolve:
    get:
      description: >-
        Resolves a vendor curve mnemonic (or a PWLS property name) to its PWLS
        standard property, QuantityClass and OSDU PropertyType UUID. Provide
        either 'mnemonic' or 'property'. With `include=hierarchy` the response
        also carries the vendor-neutral ancestry chain; its depth is variable
        because PWLS v4 is a recursive tree, not a fixed 3-tier taxonomy.
      operationId: PwlsController_resolve
      parameters:
        - name: mnemonic
          required: false
          in: query
          description: Curve mnemonic to resolve (e.g. GR, NPHI, RHOB)
          schema:
            type: string
        - name: property
          required: false
          in: query
          description: >-
            PWLS property name (e.g. 'bulk density') when the property is
            already known
          schema:
            type: string
        - name: include
          required: false
          in: query
          description: >-
