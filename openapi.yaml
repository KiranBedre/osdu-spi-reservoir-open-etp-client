        2.1, EML 2.3. Use `GET /health/converters` to list all registered
        mappings.


        **Type filtering**: Default includes common
        representation/interpretation types. Pass `typePatterns: ["*"]` for all
        types. Properties with canonical OSDU/PWLS names (porosity,
        permeability, saturation, etc.) are auto-included even without an
        explicit `*Property` pattern.


        **Key behaviors**:

        - Best-effort mode - partial results returned on converter errors (check
        `errors[]` in response)

        - Auto-generates deterministic collaboration UUID (v5 from dataspace
        name)

        - Uses `OSDU_MILESTONE` env var (default M27) for OSDU schema versions

        - GridConnectionSet records report `HasTransmissibilityMultipliers` when
        attached transmissibility properties are found

        - WellLog records populate TopMeasuredDepth/BottomMeasuredDepth from
        frame index arrays


        **createMissingReferences**: When true, creates placeholder records for
        unresolved data object references (DORs). When false, missing references
        appear in the error list.
