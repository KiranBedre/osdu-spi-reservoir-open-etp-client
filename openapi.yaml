  /dataspaces/{dataspaceId}/transactions:
    post:
      description: >-
        Start a new transaction for atomic write operations in this dataspace.


        Returns a `transactionId` UUID. Pass it to write/array endpoints as a
        query parameter.


        **Lifecycle**: commit with `PUT …/transactions/{txId}`, rollback with
        `DELETE …/transactions/{txId}`.


        **Timeout**: Auto-rollback after `TimeoutPeriod` seconds (default 300)
        if no new transaction messages occur.


        **Constraint**: Only one transaction can be active per dataspace at a
        time.


        **Typical write workflow**:

        ```

        POST  /dataspaces/{ds}/transactions              → transactionId

        PUT   /dataspaces/{ds}/resources?transactionId=…  → put objects (JSON
        array)

        PUT   /dataspaces/{ds}/resources/arrays?transactionId=… → put arrays
        (one per channel)

        PUT   /dataspaces/{ds}/transactions/{txId}        → commit

        ```
      operationId: TransactionsAPI_PostTransaction
      parameters:
        - name: data-partition-id
          in: header
          description: Data partition id (ex. 'osdu')
          schema:
            type: string
            example: data-partition-id
            maxLength: 1048
            pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
        - name: dataspaceId
          required: true
          in: path
          description: Name of dataspace
          schema:
            maxLength: 2048
            pattern: ^[^/]+(\/[^/]+)?$
            example: demo/Volve
            type: string
      requestBody:
        required: false
        description: JSON array of resqml objects
        content:
          application/json:
            schema:
              type: object
              properties:
                TimeoutPeriod:
                  type: number
                  description: >-
                    Time in seconds before transaction is automatically rolled
                    back (default 300)
                  example: 1200
                Retries:
                  type: number
                  description: >-
                    If dataspace busy, attempt to create transaction this number
                    of times (default 6)
                  example: 6
              additionalProperties: false
      responses:
        '200':
          description: Success
          content:
            application/json:
              schema:
                type: string
                maxLength: 256
                pattern: >-
                  ^[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}$
        '403':
          description: Forbidden
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 403
                    maximum: 403
                    example: 403
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '404':
          description: Not found
          content:
            application/json:
              schema:
                type: object
                additionalProperties: false
                properties:
                  statusCode:
                    type: integer
                    format: int32
                    minimum: 404
                    maximum: 404
                    example: 404
                  message:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
                  error:
                    type: string
                    pattern: ^[a-zA-Z0-9 ]*$
                    maxLength: 2048
        '406':
          description: Not acceptable response
          content:
