                          Default 1.
                      values:
                        type: array
                        items:
                          type: number
                        description: Column values, row-major.
                columns:
                  type: array
                  description: Data columns (dependent variables).
                  items:
                    type: object
                    required:
                      - propertyKind
                      - values
                    properties:
                      propertyKind:
                        type: string
                        description: >-
                          PropertyKind the column carries (kind name / DOR
