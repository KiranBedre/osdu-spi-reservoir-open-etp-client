        description: Name of dataspace
        schema:
          maxLength: 2048
          pattern: ^[^/]+(\/[^/]+)?$
          example: demo/Volve
          type: string
      requestBody:
        required: false
        description: JSON array of resqml objects
        content:
          application/json:
            schema:
              type: object
              properties:
                TimeoutPeriod:
                  type: number
                  description: Time in seconds before transaction is automatically rolled back (default 300)
                  example: 1200
                Retries:
                  type: number
                  description: If dataspace busy, attempt to create transaction this number of times (default 6)
