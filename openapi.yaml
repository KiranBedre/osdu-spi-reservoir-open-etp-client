  /Reservoir/v2/sparql:
    post:
      description: >-
        Query the RESQML/ETP graph as **RDF**. This is the semantic-web
        companion to the `/cypher` (property-graph traversal) and `/graphql`
        (typed record retrieval) endpoints, and the **query** counterpart to the
        `/rdf/*` endpoints that *emit* the same triples. Use **SPARQL** when you
        want standards-based RDF queries, `CONSTRUCT` graph reshaping, or
        interop with existing semantic-web tooling.


        **Data model (identical to the `/rdf` serializations)**

        - Every resource is a subject IRI (its ETP URI) typed
        `rddmst:<family><ver>.<Type>` (e.g.
        `rddmst:resqml20.IjkGridRepresentation`).

        - `rdfs:label` = object name; `rddms:uuid`, `rddms:dataspace`,
        `rddms:activeStatus`, `rddms:sourceCount`, `rddms:targetCount`,
        `dcterms:created`/`modified`.

        - `rddms:references` is the generic DataObjectReference edge;
        role-specific predicates (e.g. `rddms:representedInterpretation`) are
        added when the DOR path is known.


        **Pre-declared prefixes** (no PREFIX header needed): `rdf:`, `rdfs:`,
        `xsd:`, `dcterms:`, `rddms:` (`https://rddms.opengroup.org/ontology#`),
        `rddmst:` (`https://rddms.opengroup.org/type#`).


        **Supported subset** (bounded, read-only)

        ```

        SELECT [DISTINCT] (?v … | *) WHERE { BGP [FILTER …] } [ORDER BY
        …(ignored)] [LIMIT n] [OFFSET n]

        ASK       WHERE { BGP [FILTER …] }

        CONSTRUCT { template } WHERE { BGP [FILTER …] } [LIMIT n] [OFFSET n]

        DESCRIBE  (?v | <iri>) … [WHERE { BGP }]

        ```

        - Basic Graph Patterns with `;`/`,` lists and `a` for `rdf:type`.

        - Fixed-predicate property paths `rddms:references*` / `+` for
        variable-length reachability (capped at 10 hops) — the SPARQL equivalent
        of Cypher `*1..n`.

        - `FILTER` with `=, !=, <, <=, >, >=, &&, ||, !` and `regex(),
        CONTAINS(), STRSTARTS(), STRENDS(), BOUND(), isIRI(), isLiteral()`.


        **Not supported** (rejected with HTTP 400): updates
        (`INSERT/DELETE/LOAD/…`), federation (`SERVICE`), `OPTIONAL`, `UNION`,
        `MINUS`, `BIND`, `VALUES`, named graphs (`GRAPH`), aggregation/`GROUP
        BY`, and subqueries.


        **Examples**

        ```sparql

        # All grids and their names

        SELECT ?grid ?name WHERE {
          ?grid a rddmst:resqml20.IjkGridRepresentation ; rdfs:label ?name
        } ORDER BY ?name LIMIT 50


        # Does any property reference this grid? (ASK)

        ASK { ?p rddms:references
        <eml:///dataspace('demo/drogon')/resqml20.obj_IjkGridRepresentation(0c8a1e2f-…)>
        }


        # Everything reachable from a grid (variable-length path → a reshaped
