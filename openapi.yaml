                          example: a1b2c3d4-0000-0000-0000-000000000000
                        name:
                          type: string
                          example: 31/2-1
                        xml:
                          type: string
                          nullable: true
                          description: Raw Energistics XML (present when format=xml)
                        content:
                          type: object
                          nullable: true
                          description: Parsed object (present when format=json)
                        lastChanged:
                          type: string
                          format: date-time
                          nullable: true
                  count:
                    type: integer
                    description: Objects returned in this page
                    example: 1
                  total:
                    type: integer
                    description: Total matches before skip/top pagination
                    example: 1
        '401':
          description: Unauthorized
