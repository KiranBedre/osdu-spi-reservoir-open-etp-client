  /dataspaces/{dataspaceId}/transactions:
    post:
      description: "Create new transaction.\n  Returns a transaction ID that can be used to commit (Put) or rollback(Delete).\n\
        \  Transaction will be automatically rolled back after the timeout period if no new transaction messages occur.\n\
        \  TimeoutPeriod is in seconds and defaults to 300 seconds if not provided.\n  Only one transaction can be active\
        \ at a time for a given dataspace."
      operationId: TransactionsAPI_PostTransaction
      parameters:
      - name: data-partition-id
        in: header
        description: Data partition id (ex. 'osdu')
        schema:
          type: string
          example: data-partition-id
          maxLength: 1048
          pattern: ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$
