variables:
  #azure
  AZURE_SWAGGER_PATH: api/reservoir-ddms/v2/
  # cimpl-check-openapi-spec onboarding (#139)
  # NestJS does not match the shared job's auto-discovery, so point it directly
  # at the live spec. The documents are nested UNDER the route prefix (see
  # App.ts: yamlDocumentUrl = "<prefix>/openapi.yaml"); the default "<prefix>-yaml"
  # sibling 404s at the cimpl Istio ingress. The baseline lives outside the
  # gitignored docs/ tree (docs/ holds regenerated typedoc output).
  CIMPL_OPENAPI_YAML_ROUTE: "/api/reservoir-ddms/v2/openapi.yaml"
  CIMPL_OPENAPI_SPEC_PATH: "api/community/v2/openapi.yaml"
# Stub: upstream cimpl-global.yml defines jobs that `extends: .maven`, which is
# only available for Java services. Define a minimal hidden template so YAML
# validation passes; the individual cimpl-dev-* jobs are disabled via rules below.
.maven:
  image: alpine:3.21
  script:
    - echo "not applicable for Node services"

include:
  # pipeline logic
  - project: "osdu/platform/ci-cd-pipelines"
    file: "standard-setup.yml"

  # global
  - local: "devops/osdu/global/gitlab.yml"

  # build
  - local: "devops/osdu/build/open-etp-client.yml"

  # scan
  ## security scanners
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/gitlab-ultimate.yml"

  ## fossa
  - project: "osdu/platform/ci-cd-pipelines"
    file: "scanners/fossa-npm.yml"

  # lint
  - local: "devops/osdu/scanners/lint-node.yml"

  # scan for secrets
  - local: "devops/osdu/scanners/scan-for-secrets-node.yml"

  # containerize
  # osdu
  - local: "devops/osdu/containerize/osdu.yml"

  # deploy
  # azure
  # Comment at first to only run build image.
  - local: "devops/azure/azure.gitlab-ci.yml"

  # cimpl
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/cimpl-global.yml"

  - local: "devops/core-plus/pipeline/override-stages.yml"

  # gc
  - project: "osdu/platform/ci-cd-pipelines"
    file: "cloud-providers/gc-global.yml"

  - local: "devops/gc/pipeline/override-stages.yml"

  # ibm Disable IBM until fixed
  # - local: "devops/ibm/pipeline/override-stages.yml"
  # - project: "osdu/platform/ci-cd-pipelines"
  #   file: "cloud-providers/ibm-open-etp-client.yml"

# Override fossa-analyze: the upstream fossa-with-cache:v0.10 image ships Node 18.16.1
# but our package.json requires node>=20 (NestJS 11). Disable engine-strict for this
# job so npm ci can build the dependency tree fossa needs to analyze.
# allow_failure: license scanning failures should not block merges.
fossa-analyze:
  allow_failure: true
  variables:
    FOSSA_OUTPUT_DIR: fossa-output
    npm_config_engine_strict: "false"

# Override: fossa-check-notice fails due to upstream config issues unrelated to this service.
fossa-check-notice:
  allow_failure: true

# Override: trigger-trusted-tests (from standard-setup.yml) launches a downstream
# "trusted" test pipeline that cannot run on ordinary MR/branch pipelines (it
# needs trusted-validate credentials/context), so it fails and fails the whole
# pipeline. Make it non-blocking so a trusted-trigger failure does not fail the
# MR/branch pipeline. No functional change.
trigger-trusted-tests:
  allow_failure: true