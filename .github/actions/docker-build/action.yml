name: 'Docker Build'
description: 'Build a service image from a Maven JAR artifact or source context and optionally push it to GHCR'

inputs:
  image_name:
    description: 'Short service name (e.g. partition); set from vars.SERVICE_NAME. Required.'
    required: true
  dockerfile_path:
    description: 'Path to the Dockerfile relative to the repo root. Defaults to the canonical Dockerfile the engineering system syncs to every fork (ADR-037).'
    required: false
    default: 'build/Dockerfile'
  build_context:
    description: 'Docker build context directory'
    required: false
    default: '.'
  build_kind:
    description: 'maven-jar resolves a JAR, source restores a Node runtime, source-direct builds the checked-in context, and artifact uses a downloaded runtime artifact as the complete context'
    required: false
    default: 'maven-jar'
  platforms:
    description: 'Publication platforms. Empty retains the action default; validate-only builds remain linux/amd64.'
    required: false
    default: ''
  registry:
    description: 'Container registry host'
    required: false
    default: 'ghcr.io'
  org:
    description: 'Registry organisation/owner. Falls back to the workflow github.repository_owner at runtime when omitted.'
    required: false
  jar_artifact_name:
    description: 'Name of the GitHub Actions artifact that contains the built JARs'
    required: false
    default: 'build-artifacts'
  source_artifact_name:
    description: 'Name of the GitHub Actions artifact containing a prebuilt Node runtime'
    required: false
    default: 'node-runtime-artifacts'
  build_args:
    description: 'Optional --build-arg values (newline-separated KEY=VALUE). Never pass GITHUB_TOKEN here.'
    required: false
  jar_file:
    description: 'Conventional path/glob of the service Spring Boot JAR (default provider/<service>-azure/target/*-spring-boot.jar, from SERVICE_TARGET_JAR or SERVICE_NAME). If it matches no file the action auto-discovers the Azure JAR; SERVICE_TARGET_JAR is only needed to disambiguate a service that builds more than one.'
    required: false
  push:
    description: 'When true, log in to GHCR, push the image, compute branch (snapshot) tags, and flip package visibility. When false, build only (no registry auth). The caller must set this explicitly per job.'
    required: false
    default: 'true'
  github_token:
    description: 'Token for GHCR login and the package-visibility flip. Only consumed on the push path; omit for build-only callers.'
    required: false

outputs:
  image_repository:
    description: "Full registry path, e.g. ghcr.io/<org>/<service> (always set)"
    value: ${{ steps.meta.outputs.image_repository }}
  image_digest:
    description: "sha256:... digest of the pushed image (prefix already included; empty string when push is not true)"
    value: ${{ inputs.push == 'true' && steps.build.outputs.digest || '' }}
  image_tags:
    description: "Comma-separated tags pushed; for human/log use only. Deploy stages must use image_digest, not a tag."
    value: ${{ steps.tags.outputs.image_tags }}

runs:
  using: "composite"
  steps:
    - name: "Validate build kind"
      shell: bash
      env:
        BUILD_KIND: ${{ inputs.build_kind }}
      run: |
        case "$BUILD_KIND" in
          maven-jar|source|source-direct|artifact) ;;
          *) echo "::error::build_kind must be maven-jar, source, source-direct, or artifact"; exit 2 ;;
        esac

    - name: "Validate push prerequisites"
      if: ${{ inputs.push == 'true' }}
      shell: bash
      run: |
        if [ -z "${GITHUB_TOKEN:-}" ]; then
          echo "::error::push=true requires github_token (GHCR login + visibility flip)."
          exit 1
        fi
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}

    - name: "Resolve image platforms"
      id: platforms
      shell: bash
      env:
        BUILD_KIND: ${{ inputs.build_kind }}
        PUSH: ${{ inputs.push }}
        REQUESTED_PLATFORMS: ${{ inputs.platforms }}
      run: |
        if [ "$PUSH" != "true" ] || [ "$BUILD_KIND" = "source" ]; then
          platforms=linux/amd64
        elif [ -n "$REQUESTED_PLATFORMS" ]; then
          platforms=$REQUESTED_PLATFORMS
        else
          platforms=linux/amd64,linux/arm64
        fi
        case "$platforms" in
          linux/amd64|linux/amd64,linux/arm64) ;;
          *) echo "::error::platforms must be linux/amd64 or linux/amd64,linux/arm64"; exit 2 ;;
        esac
        echo "value=$platforms" >> "$GITHUB_OUTPUT"

    - name: "Compute image metadata"
      id: meta
      shell: bash
      # Inputs arrive via env, never interpolated into the script, so $(...) or backticks cannot run.
      run: |
        "$GITHUB_ACTION_PATH/compute-metadata.sh" "$REGISTRY" "$ORG" "$IMAGE_NAME"
      env:
        REGISTRY: ${{ inputs.registry }}
        ORG: ${{ inputs.org || github.repository_owner }}
        IMAGE_NAME: ${{ inputs.image_name }}

    - name: "Download build artifacts"
      if: ${{ inputs.build_kind == 'maven-jar' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.jar_artifact_name }}
        # Download into the build context so resolve-jar.sh and the context-relative COPY agree.
        path: ${{ inputs.build_context }}

    - name: "Download Node runtime artifact"
      if: ${{ inputs.build_kind == 'source' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.source_artifact_name }}
        path: ${{ runner.temp }}/node-runtime-artifact

    - name: "Restore Node runtime artifact"
      if: ${{ inputs.build_kind == 'source' }}
      shell: bash
      env:
        BUILD_CONTEXT: ${{ inputs.build_context }}
        RUNTIME_ARCHIVE: ${{ runner.temp }}/node-runtime-artifact/node-runtime.tar.gz
      run: "$GITHUB_ACTION_PATH/restore-node-runtime.sh"

    - name: "Download runtime artifact"
      if: ${{ inputs.build_kind == 'artifact' }}
      uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c  # v8.0.1
      with:
        name: ${{ inputs.source_artifact_name }}
        path: ${{ runner.temp }}/spi-runtime-artifact

    - name: "Resolve service JAR path"
      id: jar
      if: ${{ inputs.build_kind == 'maven-jar' }}
      shell: bash
      run: "$GITHUB_ACTION_PATH/resolve-jar.sh"
      env:
        REQUESTED_JAR: ${{ inputs.jar_file }}
        IMAGE_NAME: ${{ inputs.image_name }}
        BUILD_CONTEXT: ${{ inputs.build_context }}

    - name: "Resolve Java release"
      id: java
      shell: bash
      run: |
        # The fork's root pom, as java-build reads it, whatever the Docker context.
        VERSION=$(python3 "$GITHUB_ACTION_PATH/../java-release/resolve.py" pom.xml)
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"

    - name: "Compute image tags"
      id: tags
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/compute-tags.sh" "$IMAGE_REPOSITORY" "$SHORT_SHA" "$REF_NAME" "$PUSH"
      env:
        IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
        SHORT_SHA: ${{ steps.meta.outputs.short_sha }}
        REF_NAME: ${{ github.ref_name }}
        PUSH: ${{ inputs.push }}

    - name: "Set up QEMU"
      # Only the push path builds the emulated linux/arm64 leg.
      if: ${{ contains(steps.platforms.outputs.value, 'linux/arm64') }}
      uses: docker/setup-qemu-action@06116385d9baf250c9f4dcb4858b16962ea869c3  # v4.1.0

    - name: "Set up Docker Buildx"
      uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5  # v4.1.0

    - name: "Log in to GHCR"
      if: ${{ inputs.push == 'true' }}
      uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
      with:
        registry: ${{ inputs.registry }}
        username: ${{ github.actor }}
        password: ${{ inputs.github_token }}

    - name: "Stage validated build context"
      shell: bash
      env:
        BUILD_KIND: ${{ inputs.build_kind }}
        BUILD_CONTEXT: ${{ inputs.build_context }}
        DOCKERFILE_PATH: ${{ inputs.dockerfile_path }}
        ARTIFACT_CONTEXT: ${{ runner.temp }}/spi-runtime-artifact
      run: |
        set -euo pipefail
        case "$DOCKERFILE_PATH" in
          /*|*..*) echo "::error::dockerfile_path must be a repository-relative path without '..'"; exit 2 ;;
        esac

        workspace=$(realpath "$GITHUB_WORKSPACE")
        if [ "$BUILD_KIND" = "artifact" ]; then
          context=$(realpath "$ARTIFACT_CONTEXT")
        else
          case "$BUILD_CONTEXT" in
            /*|*..*) echo "::error::build_context must be a repository-relative path without '..'"; exit 2 ;;
          esac
          context=$(realpath "$BUILD_CONTEXT")
        fi
        dockerfile=$(realpath "$DOCKERFILE_PATH")
        if [ "$BUILD_KIND" = "artifact" ]; then
          [[ -d "$context" && "$context" == "$(realpath "$RUNNER_TEMP")/"* ]] \
            || { echo "::error::artifact context must resolve inside RUNNER_TEMP"; exit 2; }
        else
          [[ -d "$context" && ("$context" == "$workspace" || "$context" == "$workspace/"*) ]] \
            || { echo "::error::build_context must resolve inside the repository"; exit 2; }
        fi
        [[ -f "$dockerfile" && "$dockerfile" == "$workspace/"* ]] \
          || { echo "::error::dockerfile_path must resolve inside the repository"; exit 2; }

        target="${RUNNER_TEMP:?RUNNER_TEMP is required}/spi-service-image-context"
        rm -rf "$target"
        mkdir -p "$target"
        cp -a "$context/." "$target/"
        cp "$dockerfile" "$target/.spi.Dockerfile"

    - name: "Compute source build metadata"
      id: source-metadata
      if: ${{ inputs.build_kind == 'source-direct' }}
      shell: bash
      run: |
        commit_id="$(git rev-parse HEAD)"
        build_date="$(git show -s --format=%cI "$commit_id")"
        commit_branch="${GITHUB_HEAD_REF:-${GITHUB_REF_NAME:-}}"
        [ -n "$commit_branch" ] || commit_branch="$(git branch --show-current)"
        [ -n "$commit_branch" ] || commit_branch="detached"
        commit_message="$(git show -s --format=%s "$commit_id")"
        release_version="$(git describe --tags --exact-match "$commit_id" 2>/dev/null \
          || git describe --tags --always "$commit_id")"
        {
          echo "build_args<<EOF"
          echo "build_date=$build_date"
          echo "commit_id=$commit_id"
          echo "commit_branch=$commit_branch"
          echo "commit_message=$commit_message"
          echo "release_version=$release_version"
          echo "EOF"
        } >> "$GITHUB_OUTPUT"

    - name: "Build container image"
      id: build
      uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf  # v7.2.0
      with:
        context: ${{ runner.temp }}/spi-service-image-context
        file: ${{ runner.temp }}/spi-service-image-context/.spi.Dockerfile
        push: ${{ inputs.push == 'true' }}
        # Multi-arch only on the push path; validate-only builds skip the QEMU cost on every PR.
        # provenance:false keeps the pushed index to the two real platforms: the unknown/unknown
        # attestation manifest makes a bare docker pull miss on arm64.
        # Source artifacts are built on the amd64 Node runner and can contain native modules.
        platforms: ${{ steps.platforms.outputs.value }}
        provenance: false
        tags: ${{ steps.tags.outputs.docker_tags }}
        # Caller arguments first: a later duplicate wins, and the resolved JAR and release must.
        build-args: |
          ${{ steps.source-metadata.outputs.build_args }}
          ${{ inputs.build_args }}
          JAR_FILE=${{ steps.jar.outputs.jar_file }}
          JAVA_VERSION=${{ steps.java.outputs.version }}
        # Links the package to its repo in the GHCR UI; this inherits permissions, not visibility.
        labels: |
          org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
        cache-from: type=gha
        # ignore-error: two runs of the same PR build an identical image and collide on the
        # cache keys; a cache write must never fail an image that built successfully.
        cache-to: type=gha,mode=max,ignore-error=true

    - name: "Verify package visibility"
      if: ${{ inputs.push == 'true' && steps.build.outcome == 'success' }}
      shell: bash
      run: |
        "$GITHUB_ACTION_PATH/set-package-visibility.sh" "$ORG" "$IMAGE_NAME"
      env:
        GITHUB_TOKEN: ${{ inputs.github_token }}
        ORG: ${{ inputs.org || github.repository_owner }}
        IMAGE_NAME: ${{ inputs.image_name }}

    - name: "Summary"
      shell: bash
      run: |
        # Never echoes the token.
        if [ "$PUSH" = "true" ]; then
          HEADING="Docker Push"
          MSG="Image pushed: \`${IMAGE_REPOSITORY}@${IMAGE_DIGEST}\`"
        else
          HEADING="Docker Build"
          MSG="Dockerfile validated; no GHCR push (validate-only job)"
        fi
        echo "Repository: $IMAGE_REPOSITORY"
        echo "Tags: $IMAGE_TAGS"
        echo "$MSG"
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          {
            echo "### ${HEADING}"
            echo ""
            echo "- Repository: \`${IMAGE_REPOSITORY}\`"
            if [ "$PUSH" = "true" ]; then
              echo "- Tags: \`${IMAGE_TAGS}\`"
            fi
            echo "- ${MSG}"
          } >> "$GITHUB_STEP_SUMMARY"
        fi
      env:
        IMAGE_REPOSITORY: ${{ steps.meta.outputs.image_repository }}
        IMAGE_TAGS: ${{ steps.tags.outputs.image_tags }}
        PUSH: ${{ inputs.push }}
        IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
