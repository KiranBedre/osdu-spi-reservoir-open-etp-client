name: GHCR Retention

# Prunes old image tags from GHCR for the service image, its descriptor-owned
# companion when present, and the two template-owned images built beside it,
# <service>-acceptance and <service>-load:
#   :sha-<short>        delete when older than 30 days
#   :<branch>-snapshot  keep the newest 5 per protected branch
#   :<version> (semver) keep forever (never deleted)
# One policy keeps all images from a source commit alive exactly as long as the
# primary digest. Scheduled runs prune for real; manual runs default to a
# dry-run so the policy can be observed before it deletes anything.

on:
  schedule:
    - cron: '0 5 * * 1'   # Weekly, Mondays 05:00 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List candidate deletions without deleting (manual runs default to true)'
        required: false
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

jobs:
  retention:
    name: "🧹 Prune GHCR tags"
    if: ${{ vars.INITIALIZATION_COMPLETE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Prune old image tags"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
          OWNER: ${{ github.repository_owner }}
          SERVICE_NAME: ${{ vars.SERVICE_NAME }}
          REPO_NAME: ${{ github.event.repository.name }}
        run: |
          set -euo pipefail

          OWNER_LC=$(printf '%s' "$OWNER" | tr '[:upper:]' '[:lower:]')
          SERVICE=$(printf '%s' "${SERVICE_NAME:-$REPO_NAME}" | tr '[:upper:]' '[:lower:]')
          COMPANION_SUFFIX=""
          if [ -f .spi/service.yaml ]; then
            python3 .github/actions/acceptance-resolver/resolve.py \
              --contract-only --descriptor .spi/service.yaml --report "$RUNNER_TEMP/service.json"
            COMPANION_SUFFIX=$(jq -r '.service_config.companion.package_suffix' "$RUNNER_TEMP/service.json")
          fi

          # Org packages live under /orgs/<org>/...; a user's own packages under /user/...
          OWNER_TYPE="$(gh api "/users/${OWNER_LC}" --jq '.type' 2>/dev/null || echo "")"
          if [ "$OWNER_TYPE" = "Organization" ]; then BASE="orgs/${OWNER_LC}"; else BASE="user"; fi

          NOW=$(date -u +%s)
          CUTOFF=$(( NOW - 30 * 24 * 3600 ))

          delete_version() {
            pkg="$1"; id="$2"; reason="$3"
            if [ "$DRY_RUN" = "true" ]; then
              echo "DRY-RUN would delete ${pkg} version ${id} (${reason})"
              echo "- would delete \`${id}\`: ${reason}" >> "$GITHUB_STEP_SUMMARY"
            else
              if gh api -X DELETE "${BASE}/packages/container/${pkg}/versions/${id}" >/dev/null 2>&1; then
                echo "Deleted ${pkg} version ${id} (${reason})"
                echo "- deleted \`${id}\`: ${reason}" >> "$GITHUB_STEP_SUMMARY"
              else
                echo "::warning::Could not delete ${pkg} version ${id} (${reason}); continuing"
              fi
            fi
          }

          prune_package() {
            PKG="$1"
            echo "Package: ${OWNER_LC}/${PKG}  (base: ${BASE}, dry_run: ${DRY_RUN})"
            echo "### GHCR retention: ${OWNER_LC}/${PKG} (dry_run: ${DRY_RUN})" >> "$GITHUB_STEP_SUMMARY"

            # A fork without a suite or a payload has no such package: gh api exits nonzero on the
            # 404 and, under pipefail, so does the pipeline, so the read yields [] instead of aborting.
            if ! VERSIONS="$(gh api --paginate "${BASE}/packages/container/${PKG}/versions" 2>/dev/null | jq -s 'add // []')"; then
              VERSIONS='[]'
            fi
            COUNT="$(echo "$VERSIONS" | jq 'length')"
            if [ "$COUNT" -eq 0 ]; then
              echo "No versions found for ${OWNER_LC}/${PKG}; nothing to do."
              echo "- no versions found" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            # Any semver-tagged version is a release and leaves every bucket, pre-release and build metadata included.
            ELIGIBLE="$(echo "$VERSIONS" | jq '[ .[] | select((.metadata.container.tags // []) | any(test("^v?[0-9]+\\.[0-9]+\\.[0-9]+([-+].*)?$")) | not) ]')"

            SHA_IDS="$(echo "$ELIGIBLE" | jq -r --argjson cutoff "$CUTOFF" '
              .[]
              | select((.metadata.container.tags // []) | length > 0 and all(startswith("sha-")))
              | select((.created_at | fromdateiso8601) < $cutoff)
              | .id')"

            SNAP_IDS="$(echo "$ELIGIBLE" | jq -r '
              [ .[] | select((.metadata.container.tags // []) | any(endswith("-snapshot"))) ]
              | group_by([ .metadata.container.tags[] | select(endswith("-snapshot")) ][0])
              | map(sort_by(.created_at) | reverse | .[5:])
              | flatten | .[].id')"

            for id in $SHA_IDS;  do delete_version "$PKG" "$id" "sha-* older than 30 days"; done
            for id in $SNAP_IDS; do delete_version "$PKG" "$id" "snapshot beyond newest 5 per branch"; done
          }

          packages=("$SERVICE" "${SERVICE}-acceptance" "${SERVICE}-load" "${SERVICE}-dag")
          if [ -n "$COMPANION_SUFFIX" ]; then
            packages+=("${SERVICE}${COMPANION_SUFFIX}")
          fi
          for pkg in "${packages[@]}"; do
            prune_package "$pkg"
          done
          echo "Retention complete."
