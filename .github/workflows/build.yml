name: Build and Test

# Push-only: PR events belong to validate.yml and dependabot-validation.yml, whose builds
# generate the same coverage, so one commit is never built twice.
on:
  push:
    branches: 
      - '**'
      - '!main'
      - '!fork_integration'
      - '!fork_upstream'
      - '!sync/**'
      - '!dependabot/**'
    paths-ignore:
      - '.github/workflows/**'
      - '.github/template-workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/actions/**'
      - '.github/*.md'
      - '.github/*.json'
      - '.github/*.yml'
      - '.github/*.yaml'
      - '.github/.template-sync-commit'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - 'NOTICE'
permissions:
  contents: read
  pull-requests: write

jobs:
  check-repo-state:
    name: "Check Repository"
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check_init.outputs.initialized }}
      archetype: ${{ steps.check_init.outputs.archetype }}
      source_path: ${{ steps.check_init.outputs.source_path }}
      node_version: ${{ steps.check_init.outputs.node_version }}
      python_version: ${{ steps.check_init.outputs.python_version }}
      airflow_version: ${{ steps.check_init.outputs.airflow_version }}
      dag_path: ${{ steps.check_init.outputs.dag_path }}
      dag_id: ${{ steps.check_init.outputs.dag_id }}
      image_context: ${{ steps.check_init.outputs.image_context }}
      image_dockerfile: ${{ steps.check_init.outputs.image_dockerfile }}
      companion_kind: ${{ steps.check_init.outputs.companion_kind }}
      companion_source_path: ${{ steps.check_init.outputs.companion_source_path }}
      companion_python_version: ${{ steps.check_init.outputs.companion_python_version }}
      companion_airflow_version: ${{ steps.check_init.outputs.companion_airflow_version }}
      companion_dag_path: ${{ steps.check_init.outputs.companion_dag_path }}
      companion_dag_id: ${{ steps.check_init.outputs.companion_dag_id }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        
      - name: "Check Repository Initialization"
        id: check_init
        run: |
          set -euo pipefail
          if [ -f ".spi/service.yaml" ]; then
            python3 .github/actions/acceptance-resolver/resolve.py \
              --contract-only --descriptor .spi/service.yaml --report "$RUNNER_TEMP/service.json"
            archetype=$(jq -r '.service_config.archetype' "$RUNNER_TEMP/service.json")
            source_path=$(jq -r '.service_config.source_path' "$RUNNER_TEMP/service.json")
            node_version=$(jq -r '.service_config.node_version' "$RUNNER_TEMP/service.json")
            python_version=$(jq -r '.service_config.python_version' "$RUNNER_TEMP/service.json")
            airflow_version=$(jq -r '.service_config.airflow_version' "$RUNNER_TEMP/service.json")
            dag_path=$(jq -r '.service_config.dag_path' "$RUNNER_TEMP/service.json")
            dag_id=$(jq -r '.service_config.dag_id' "$RUNNER_TEMP/service.json")
            image_context=$(jq -r '.service_config.image.context' "$RUNNER_TEMP/service.json")
            image_dockerfile=$(jq -r '.service_config.image.dockerfile' "$RUNNER_TEMP/service.json")
            companion_kind=$(jq -r '.service_config.companion.kind' "$RUNNER_TEMP/service.json")
            companion_source_path=$(jq -r '.service_config.companion.source_path' "$RUNNER_TEMP/service.json")
            companion_python_version=$(jq -r '.service_config.companion.python_version' "$RUNNER_TEMP/service.json")
            companion_airflow_version=$(jq -r '.service_config.companion.airflow_version' "$RUNNER_TEMP/service.json")
            companion_dag_path=$(jq -r '.service_config.companion.dag_path' "$RUNNER_TEMP/service.json")
            companion_dag_id=$(jq -r '.service_config.companion.dag_id' "$RUNNER_TEMP/service.json")
          elif [ -f "pom.xml" ] || [ -n "$(find . -name 'pom.xml' -type f)" ]; then
            archetype=java-maven-azure
            source_path=.
            node_version=
            python_version=
            airflow_version=
            dag_path=
            dag_id=
            image_context=.
            image_dockerfile=build/Dockerfile
            companion_kind=
            companion_source_path=
            companion_python_version=
            companion_airflow_version=
            companion_dag_path=
            companion_dag_id=
          else
            archetype=
            source_path=
            node_version=
            python_version=
            airflow_version=
            dag_path=
            dag_id=
            image_context=
            image_dockerfile=
            companion_kind=
            companion_source_path=
            companion_python_version=
            companion_airflow_version=
            companion_dag_path=
            companion_dag_id=
          fi

          if [ -n "$archetype" ] && [ -d "$source_path" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi
          echo "archetype=$archetype" >> $GITHUB_OUTPUT
          echo "source_path=$source_path" >> $GITHUB_OUTPUT
          echo "node_version=$node_version" >> $GITHUB_OUTPUT
          echo "python_version=$python_version" >> $GITHUB_OUTPUT
          echo "airflow_version=$airflow_version" >> $GITHUB_OUTPUT
          echo "dag_path=$dag_path" >> $GITHUB_OUTPUT
          echo "dag_id=$dag_id" >> $GITHUB_OUTPUT
          echo "image_context=$image_context" >> $GITHUB_OUTPUT
          echo "image_dockerfile=$image_dockerfile" >> $GITHUB_OUTPUT
          echo "companion_kind=$companion_kind" >> $GITHUB_OUTPUT
          echo "companion_source_path=$companion_source_path" >> $GITHUB_OUTPUT
          echo "companion_python_version=$companion_python_version" >> $GITHUB_OUTPUT
          echo "companion_airflow_version=$companion_airflow_version" >> $GITHUB_OUTPUT
          echo "companion_dag_path=$companion_dag_path" >> $GITHUB_OUTPUT
          echo "companion_dag_id=$companion_dag_id" >> $GITHUB_OUTPUT

  java-build:
    name: "Java Build"
    needs: check-repo-state
    if: needs.check-repo-state.outputs.initialized == 'true' && needs.check-repo-state.outputs.archetype == 'java-maven-azure'
    runs-on: ubuntu-latest
    outputs:
      is_java_project: ${{ steps.build.outputs.is_java_project }}
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
      
      - name: "Run Java Build"
        id: build
        uses: ./.github/actions/java-build
        with:
          build_env: ${{ vars.BUILD_ENV }}

  node-build:
    name: "Node Build"
    needs: check-repo-state
    if: needs.check-repo-state.outputs.initialized == 'true' && needs.check-repo-state.outputs.archetype == 'node-typescript-azure'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Run Node Build"
        id: build
        uses: ./.github/actions/node-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.source_path }}
          node_version: ${{ needs.check-repo-state.outputs.node_version }}

  python-build:
    name: "Python Build"
    needs: check-repo-state
    if: |
      needs.check-repo-state.outputs.initialized == 'true' &&
      (needs.check-repo-state.outputs.archetype == 'python-fastapi-azure' ||
       needs.check-repo-state.outputs.archetype == 'airflow-dag-azure')
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Run Python Build"
        id: build
        uses: ./.github/actions/python-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.source_path }}
          python_version: ${{ needs.check-repo-state.outputs.python_version }}
          airflow_version: ${{ needs.check-repo-state.outputs.airflow_version }}
          dag_path: ${{ needs.check-repo-state.outputs.dag_path }}
          dag_id: ${{ needs.check-repo-state.outputs.dag_id }}

  native-container-build:
    name: "Native Container Build"
    needs: check-repo-state
    if: needs.check-repo-state.outputs.initialized == 'true' && needs.check-repo-state.outputs.archetype == 'native-container-azure'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Run Native Container Build"
        id: build
        uses: ./.github/actions/native-container-build
        with:
          build_context: ${{ needs.check-repo-state.outputs.image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.image_dockerfile }}

  companion-python-build:
    name: "Companion Airflow Build"
    needs: check-repo-state
    if: |
      needs.check-repo-state.outputs.initialized == 'true' &&
      needs.check-repo-state.outputs.companion_kind == 'airflow-dag'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Run Companion Airflow Build"
        id: build
        uses: ./.github/actions/python-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.companion_source_path }}
          python_version: ${{ needs.check-repo-state.outputs.companion_python_version }}
          airflow_version: ${{ needs.check-repo-state.outputs.companion_airflow_version }}
          dag_path: ${{ needs.check-repo-state.outputs.companion_dag_path }}
          dag_id: ${{ needs.check-repo-state.outputs.companion_dag_id }}

  code-coverage:
    name: "📊 Code Coverage"
    needs: [check-repo-state, java-build]
    if: needs.check-repo-state.outputs.archetype == 'java-maven-azure'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Resolve Java release"
        id: java
        uses: ./.github/actions/java-release

      - name: "Setup Java Environment"
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: '**/pom.xml'

      - name: "Setup Maven"
        uses: ./.github/actions/setup-maven

      - name: "Cache Maven Packages"
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830  # v4.3.0
        with:
          path: |
            ~/.m2/repository
            !~/.m2/repository/org/opengroup/osdu
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}

      - name: "Export build environment"
        if: vars.BUILD_ENV != ''
        env:
          BUILD_ENV: ${{ vars.BUILD_ENV }}
        run: bash .github/actions/java-build/build-env.sh

      - name: "Generate Coverage Report"
        env:
          MAVEN_OPTS: "-Dmaven.repo.local=$HOME/.m2/repository"
        run: |
          # flatten substitutes the version into pom comments, so keep it to [A-Za-z0-9._-] with no '--'.
          SAFE_REF=$(printf '%s' "$GITHUB_REF_NAME" | tr -c 'A-Za-z0-9._' '-' | tr -s '-')
          MAVEN_CLI_OPTS="--batch-mode -Drevision=${SAFE_REF}-SNAPSHOT"

          if [ -f ".mvn/community-maven.settings.xml" ]; then
            MAVEN_CLI_OPTS="$MAVEN_CLI_OPTS --settings=.mvn/community-maven.settings.xml"
          fi
          
          mvn $MAVEN_CLI_OPTS clean test org.jacoco:jacoco-maven-plugin:0.8.14:report
          echo "# Test Coverage Report" >> $GITHUB_STEP_SUMMARY
          echo "## Summary" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          find . -name "index.html" -path "*/target/site/jacoco/*" -exec grep -o '<tfoot>.*</tfoot>' {} \; | sed 's/<[^>]*>//g' >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: "Upload Coverage Report"
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4  # v5.0.0
        with:
          name: coverage-report
          path: '**/target/site/jacoco/'
          retention-days: 2