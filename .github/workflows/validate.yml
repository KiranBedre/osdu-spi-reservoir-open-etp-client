name: Validation

on:
  # No paths-ignore on either PR trigger: a path-skipped workflow leaves the required
  # "Validation Summary" check Pending and wedges the PR (ADR-030). check-paths gates the heavy jobs.
  pull_request:
    branches: [main, fork_integration, fork_upstream]
  pull_request_target:
    branches: [main, fork_integration, fork_upstream]
    types: [opened, synchronize, reopened]
  push:
    branches: [main, fork_integration, fork_upstream]
    paths-ignore:
      - '.github/workflows/**'
      - '.github/template-workflows/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/actions/**'
      - '.github/*.md'
      - '.github/*.json'
      - '.github/*.yml'
      - '.github/*.yaml'
      - '.github/.template-sync-commit'
      - '.vscode/**'
      - 'docs/**'
      - '**.md'
      - '**.txt'
      - 'LICENSE'
      - 'NOTICE'
  workflow_dispatch:
    inputs:
      post_init:
        description: 'Is this a post-initialization validation?'
        required: false
        type: boolean
        default: false
      initialization_complete:
        description: 'Force initialization status (used during post-init)'
        required: false
        type: boolean
        default: false
      force_full_pipeline:
        description: 'Run the full build and trusted image publication pipeline'
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write

jobs:
  check-initialization:
    name: "Check Initialization"
    # One lane per PR: same-repo sync/ PRs take pull_request_target, which reads this file from
    # the default branch (fork_upstream has none in filter mode). Every other PR takes pull_request.
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'pull_request' &&
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'sync/'))) ||
      (github.event_name == 'pull_request_target' &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'sync/')) ||
      (github.event_name == 'push' && 
       !contains(github.event.head_commit.message, 'chore: complete repository initialization') &&
       !contains(github.event.head_commit.message, 'chore: clean up template files after initialization'))
    runs-on: ubuntu-latest
    outputs:
      initialized: ${{ steps.check.outputs.initialized }}
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # pull_request_target must build the PR head, not the base.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Verify Initialization Status"
        id: check
        run: |
          echo "🔍 Debug: Event name = '${{ github.event_name }}'"
          echo "🔍 Debug: Repository variable INITIALIZATION_COMPLETE = '${{ vars.INITIALIZATION_COMPLETE }}'"
          echo "🔍 Debug: Workflow input initialization_complete = '${{ inputs.initialization_complete }}'"
          echo "🔍 Debug: Workflow input post_init = '${{ inputs.post_init }}'"
          
          INITIALIZED=false

          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.initialization_complete }}" = "true" ]; then
            INITIALIZED=true
            echo "✅ Initialization confirmed via workflow input"
          elif [ "${{ vars.INITIALIZATION_COMPLETE }}" = "true" ]; then
            INITIALIZED=true
            echo "✅ Initialization confirmed via repository variable"
          else
            echo "🔍 Checking structural indicators for initialization..."
            if git ls-remote --heads origin | grep -q "refs/heads/fork_upstream" && \
               git ls-remote --heads origin | grep -q "refs/heads/fork_integration" && \
               ([ -f ".spi/service.yaml" ] || [ -f "pom.xml" ] || \
                [ -n "$(find . -name 'pom.xml' -type f 2>/dev/null)" ]); then
              INITIALIZED=true
              echo "✅ Initialization detected via structural indicators"
            fi
          fi
          
          if [ "$INITIALIZED" = "true" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
            echo "✅ Repository is initialized"
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
            echo "⏸️ Repository not yet initialized"
          fi

  check-repo-state:
    name: "Check Repository"
    needs: check-initialization
    if: needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    outputs:
      is_initialized: ${{ steps.check_init.outputs.initialized }}
      is_java_repo: ${{ steps.check_init.outputs.is_java }}
      archetype: ${{ steps.check_init.outputs.archetype }}
      source_path: ${{ steps.check_init.outputs.source_path }}
      node_version: ${{ steps.check_init.outputs.node_version }}
      python_version: ${{ steps.check_init.outputs.python_version }}
      airflow_version: ${{ steps.check_init.outputs.airflow_version }}
      dag_path: ${{ steps.check_init.outputs.dag_path }}
      dag_id: ${{ steps.check_init.outputs.dag_id }}
      image_context: ${{ steps.check_init.outputs.image_context }}
      image_dockerfile: ${{ steps.check_init.outputs.image_dockerfile }}
      image_platforms: ${{ steps.check_init.outputs.image_platforms }}
      companion_kind: ${{ steps.check_init.outputs.companion_kind }}
      companion_package_suffix: ${{ steps.check_init.outputs.companion_package_suffix }}
      companion_source_path: ${{ steps.check_init.outputs.companion_source_path }}
      companion_python_version: ${{ steps.check_init.outputs.companion_python_version }}
      companion_airflow_version: ${{ steps.check_init.outputs.companion_airflow_version }}
      companion_dag_path: ${{ steps.check_init.outputs.companion_dag_path }}
      companion_dag_id: ${{ steps.check_init.outputs.companion_dag_id }}
      companion_image_context: ${{ steps.check_init.outputs.companion_image_context }}
      companion_image_dockerfile: ${{ steps.check_init.outputs.companion_image_dockerfile }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Check Repository Initialization"
        id: check_init
        run: |
          set -euo pipefail
          if [ -f ".spi/service.yaml" ]; then
            python3 .github/actions/acceptance-resolver/resolve.py \
              --contract-only --descriptor .spi/service.yaml --report "$RUNNER_TEMP/service.json"
            archetype=$(jq -r '.service_config.archetype' "$RUNNER_TEMP/service.json")
            source_path=$(jq -r '.service_config.source_path' "$RUNNER_TEMP/service.json")
            node_version=$(jq -r '.service_config.node_version' "$RUNNER_TEMP/service.json")
            python_version=$(jq -r '.service_config.python_version' "$RUNNER_TEMP/service.json")
            airflow_version=$(jq -r '.service_config.airflow_version' "$RUNNER_TEMP/service.json")
            dag_path=$(jq -r '.service_config.dag_path' "$RUNNER_TEMP/service.json")
            dag_id=$(jq -r '.service_config.dag_id' "$RUNNER_TEMP/service.json")
            image_context=$(jq -r '.service_config.image.context' "$RUNNER_TEMP/service.json")
            image_dockerfile=$(jq -r '.service_config.image.dockerfile' "$RUNNER_TEMP/service.json")
            image_platforms=$(jq -r '.service_config.image.platforms' "$RUNNER_TEMP/service.json")
            companion_kind=$(jq -r '.service_config.companion.kind' "$RUNNER_TEMP/service.json")
            companion_package_suffix=$(jq -r '.service_config.companion.package_suffix' "$RUNNER_TEMP/service.json")
            companion_source_path=$(jq -r '.service_config.companion.source_path' "$RUNNER_TEMP/service.json")
            companion_python_version=$(jq -r '.service_config.companion.python_version' "$RUNNER_TEMP/service.json")
            companion_airflow_version=$(jq -r '.service_config.companion.airflow_version' "$RUNNER_TEMP/service.json")
            companion_dag_path=$(jq -r '.service_config.companion.dag_path' "$RUNNER_TEMP/service.json")
            companion_dag_id=$(jq -r '.service_config.companion.dag_id' "$RUNNER_TEMP/service.json")
            companion_image_context=$(jq -r '.service_config.companion.image.context' "$RUNNER_TEMP/service.json")
            companion_image_dockerfile=$(jq -r '.service_config.companion.image.dockerfile' "$RUNNER_TEMP/service.json")
          elif [ -f "pom.xml" ] || [ -n "$(find . -name 'pom.xml' -type f)" ]; then
            archetype=java-maven-azure
            source_path=.
            node_version=
            python_version=
            airflow_version=
            dag_path=
            dag_id=
            image_context=.
            image_dockerfile=build/Dockerfile
            image_platforms=
            companion_kind=
            companion_package_suffix=
            companion_source_path=
            companion_python_version=
            companion_airflow_version=
            companion_dag_path=
            companion_dag_id=
            companion_image_context=
            companion_image_dockerfile=
          else
            archetype=
            source_path=
            node_version=
            python_version=
            airflow_version=
            dag_path=
            dag_id=
            image_context=
            image_dockerfile=
            image_platforms=
            companion_kind=
            companion_package_suffix=
            companion_source_path=
            companion_python_version=
            companion_airflow_version=
            companion_dag_path=
            companion_dag_id=
            companion_image_context=
            companion_image_dockerfile=
          fi

          if [ -n "$archetype" ] && [ -d "$source_path" ]; then
            echo "initialized=true" >> $GITHUB_OUTPUT
          else
            echo "initialized=false" >> $GITHUB_OUTPUT
          fi
          if [ "$archetype" = "java-maven-azure" ]; then
            echo "is_java=true" >> $GITHUB_OUTPUT
          else
            echo "is_java=false" >> $GITHUB_OUTPUT
          fi
          echo "archetype=$archetype" >> $GITHUB_OUTPUT
          echo "source_path=$source_path" >> $GITHUB_OUTPUT
          echo "node_version=$node_version" >> $GITHUB_OUTPUT
          echo "python_version=$python_version" >> $GITHUB_OUTPUT
          echo "airflow_version=$airflow_version" >> $GITHUB_OUTPUT
          echo "dag_path=$dag_path" >> $GITHUB_OUTPUT
          echo "dag_id=$dag_id" >> $GITHUB_OUTPUT
          echo "image_context=$image_context" >> $GITHUB_OUTPUT
          echo "image_dockerfile=$image_dockerfile" >> $GITHUB_OUTPUT
          echo "image_platforms=$image_platforms" >> $GITHUB_OUTPUT
          echo "companion_kind=$companion_kind" >> $GITHUB_OUTPUT
          echo "companion_package_suffix=$companion_package_suffix" >> $GITHUB_OUTPUT
          echo "companion_source_path=$companion_source_path" >> $GITHUB_OUTPUT
          echo "companion_python_version=$companion_python_version" >> $GITHUB_OUTPUT
          echo "companion_airflow_version=$companion_airflow_version" >> $GITHUB_OUTPUT
          echo "companion_dag_path=$companion_dag_path" >> $GITHUB_OUTPUT
          echo "companion_dag_id=$companion_dag_id" >> $GITHUB_OUTPUT
          echo "companion_image_context=$companion_image_context" >> $GITHUB_OUTPUT
          echo "companion_image_dockerfile=$companion_image_dockerfile" >> $GITHUB_OUTPUT

  check-paths:
    name: "Check Paths"
    needs: check-initialization
    if: needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.filter.outputs.should_run }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          # pull_request_target diffs against the PR head; pull_request resolves to the merge sha.
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Check for build-relevant changes"
        id: filter
        run: |
          if [ "${{ github.event_name }}" = "push" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Build-relevant: ${{ github.event_name }} trigger"
            exit 0
          fi

          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          CHANGED_FILES=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" || echo "")

          if [ -z "$CHANGED_FILES" ]; then
            echo "should_run=true" >> $GITHUB_OUTPUT
            echo "Build-relevant: unable to determine changed files"
            exit 0
          fi

          # .mvn/ and .spi/ are never config-only: they control the build and acceptance contract.
          SHOULD_RUN=false
          while IFS= read -r file; do
            case "$file" in .mvn/*|.spi/*) SHOULD_RUN=true; break ;; esac
            if echo "$file" | grep -qE '^(\.github/|devops/|docs/|\.)|\.md$'; then
              continue
            fi
            SHOULD_RUN=true
            break
          done <<< "$CHANGED_FILES"

          echo "should_run=$SHOULD_RUN" >> $GITHUB_OUTPUT
          if [ "$SHOULD_RUN" = "true" ]; then
            echo "Build-relevant: code changes detected"
          else
            echo "Skipping build: only config/docs paths changed"
          fi

      - name: "List upstream-owned files the PR changes"
        id: owned
        # pull_request only: the pull_request_target lane checks out the PR head, and a local action
        # resolved from there would run PR-controlled code with this lane's token (ADR-036). That
        # lane carries same-repo sync PRs to fork_upstream, which the split never applies to.
        if: github.event_name == 'pull_request'
        uses: ./.github/actions/upstream-owned-files
        with:
          base_ref: ${{ github.event.pull_request.base.ref }}
          head_ref: ${{ github.event.pull_request.head.ref }}
          base_sha: ${{ github.event.pull_request.base.sha }}
          head_sha: ${{ github.event.pull_request.head.sha }}
          same_repo: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          sync_mode: ${{ vars.SYNC_MODE }}

      - name: "Assert upstream ownership split (ADR-038)"
        if: steps.owned.outputs.checked == 'true' && steps.owned.outputs.files != ''
        env:
          TOUCHED: ${{ steps.owned.outputs.files }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Read the label live: labeling does not trigger a run, so a re-run of this job must see it.
          if ! HAS_PORT_LABEL=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/labels" --jq 'any(.[]; .name == "port")'); then
            echo "::error::Unable to read the labels on pull request #$PR_NUMBER to enforce the ownership split"
            exit 1
          fi

          if [ "$HAS_PORT_LABEL" = "true" ]; then
            while IFS= read -r file; do
              echo "::notice file=$file::Declared port of an upstream-owned file (port label)"
            done <<< "$TOUCHED"
            exit 0
          fi

          while IFS= read -r file; do
            echo "::error file=$file::Upstream-owned file changed on a PR to main without the port label (ADR-038). Add the 'port' label and re-run Check Paths to declare a deliberate port, or contribute the change upstream instead. A fork initialized before the label existed creates it first: gh label create port"
          done <<< "$TOUCHED"
          exit 1

  java-build:
    name: "Java Build"
    needs: [check-initialization, check-repo-state, check-paths]
    # Dependabot PRs build in dependabot-validation.yml; config-only PRs skip the build.
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      needs.check-repo-state.outputs.is_java_repo == 'true' &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      is_java_project: ${{ steps.build.outputs.is_java_project }}
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          # Sync branches carry no .github/actions; validate with main's trusted copy.
          echo "🔧 Restoring local actions from main branch for sync PR validation..."
          if ! git fetch origin main --depth=1; then
            echo "❌ Failed to fetch 'main' branch from origin. Cannot restore local actions."
            exit 1
          fi
          if ! git checkout origin/main -- .github/actions/; then
            echo "❌ Failed to restore .github/actions/ from origin/main. Cannot proceed with validation."
            exit 1
          fi
          echo "✅ Local actions restored - validation can proceed"

      - name: Resolve Java release
        id: java
        uses: ./.github/actions/java-release

      - name: Set up JDK
        uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654  # v5.2.0
        with:
          java-version: ${{ steps.java.outputs.version }}
          distribution: 'temurin'
          cache: 'maven'
          
      - name: Cache Maven packages
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          path: ~/.m2
          key: ${{ runner.os }}-m2-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-m2-

          
      - name: Setup Maven Settings
        run: |
          if [ -f ".mvn/community-maven.settings.xml" ]; then
            mkdir -p ~/.m2
            cp .mvn/community-maven.settings.xml ~/.m2/settings.xml
            echo "📝 Maven settings configured from .mvn/community-maven.settings.xml"
          else
            echo "📝 No custom Maven settings found, using defaults"
          fi
        
      - name: "Run Java Build"
        id: build
        uses: ./.github/actions/java-build
        with:
          generate_coverage: ${{ github.event_name == 'pull_request' || github.event_name == 'pull_request_target' }}
          # core is activeByDefault, so a bare profile flag would drop it (ADR-035). Filter-mode
          # fork_upstream builds core only: its azure profile points at fork-owned directories that
          # exist only after the cascade merge. Verbatim modes carry the complete upstream tree.
          maven_profile: ${{ ((github.base_ref == 'fork_upstream' || github.ref_name == 'fork_upstream') && (vars.SYNC_MODE == '' || vars.SYNC_MODE == 'filter' || vars.SYNC_MODE == 'filtered-snapshot')) && 'core' || vars.MAVEN_PROFILE || 'core,azure' }}
          build_env: ${{ vars.BUILD_ENV }}

  node-build:
    name: "Node Build"
    needs: [check-initialization, check-repo-state, check-paths]
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      needs.check-repo-state.outputs.archetype == 'node-typescript-azure' &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/actions/

      - name: "Run Node Build"
        id: build
        uses: ./.github/actions/node-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.source_path }}
          node_version: ${{ needs.check-repo-state.outputs.node_version }}

  python-build:
    name: "Python Build"
    needs: [check-initialization, check-repo-state, check-paths]
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      (needs.check-repo-state.outputs.archetype == 'python-fastapi-azure' ||
       needs.check-repo-state.outputs.archetype == 'airflow-dag-azure') &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/actions/

      - name: "Run Python Build"
        id: build
        uses: ./.github/actions/python-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.source_path }}
          python_version: ${{ needs.check-repo-state.outputs.python_version }}
          airflow_version: ${{ needs.check-repo-state.outputs.airflow_version }}
          dag_path: ${{ needs.check-repo-state.outputs.dag_path }}
          dag_id: ${{ needs.check-repo-state.outputs.dag_id }}

  native-container-build:
    name: "Native Container Build"
    needs: [check-initialization, check-repo-state, check-paths]
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      needs.check-repo-state.outputs.archetype == 'native-container-azure' &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/actions/

      - name: "Run Native Container Build"
        id: build
        uses: ./.github/actions/native-container-build
        with:
          build_context: ${{ needs.check-repo-state.outputs.image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.image_dockerfile }}

  companion-python-build:
    name: "Companion Airflow Build"
    needs: [check-initialization, check-repo-state, check-paths]
    if: |
      needs.check-repo-state.outputs.is_initialized == 'true' &&
      needs.check-repo-state.outputs.companion_kind == 'airflow-dag' &&
      needs.check-paths.outputs.should_run == 'true' &&
      github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    outputs:
      build_result: ${{ steps.build.outputs.build_result }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          git fetch origin main --depth=1
          git checkout origin/main -- .github/actions/

      - name: "Run Companion Airflow Build"
        id: build
        uses: ./.github/actions/python-build
        with:
          working_directory: ${{ needs.check-repo-state.outputs.companion_source_path }}
          python_version: ${{ needs.check-repo-state.outputs.companion_python_version }}
          airflow_version: ${{ needs.check-repo-state.outputs.companion_airflow_version }}
          dag_path: ${{ needs.check-repo-state.outputs.companion_dag_path }}
          dag_id: ${{ needs.check-repo-state.outputs.companion_dag_id }}

  docker-build:
    # Validate-only build of both images; the trusted push is docker-push and the required check
    # is the summary job at the end.
    # Skipped for filter-mode fork_upstream, which builds core only and has no Azure JAR to package.
    # No pull_request_target lane and no checkout ref: a PR-head ref in a read-only job is a CodeQL
    # cache-poisoning finding in every fork (#164). Sync PRs get their image validated on the cascade PR.
    name: "Docker Build"
    needs: [check-initialization, check-repo-state, java-build, node-build, python-build, native-container-build, companion-python-build]
    if: |
      always() &&
      (needs.java-build.outputs.build_result == 'success' ||
       needs.node-build.outputs.build_result == 'success' ||
       needs.python-build.outputs.build_result == 'success' ||
       needs.native-container-build.outputs.build_result == 'success') &&
      (needs.check-repo-state.outputs.companion_kind == '' ||
       needs.companion-python-build.outputs.build_result == 'success') &&
      github.event_name != 'pull_request_target' &&
      (vars.SYNC_MODE == 'mirror' || vars.SYNC_MODE == 'passthrough' ||
       vars.SYNC_MODE == 'snapshot' ||
       (github.base_ref != 'fork_upstream' && github.ref_name != 'fork_upstream'))
    runs-on: ubuntu-latest
    permissions:
      contents: read          # no packages: write, this job runs untrusted Dockerfile content
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Service Image"
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          build_kind: ${{ needs.check-repo-state.outputs.archetype == 'java-maven-azure' && 'maven-jar' || (needs.check-repo-state.outputs.archetype == 'node-typescript-azure' && 'source' || 'source-direct') }}
          build_context: ${{ needs.check-repo-state.outputs.image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.image_dockerfile }}
          platforms: ${{ needs.check-repo-state.outputs.image_platforms }}
          # Conventional JAR path; the action auto-discovers the Azure JAR when a deviant module name
          # (e.g. entitlements-v2-azure) does not match. SERVICE_TARGET_JAR forces a path (ADR-037).
          jar_file: ${{ vars.SERVICE_TARGET_JAR || format('provider/{0}-azure/target/*-spring-boot.jar', vars.SERVICE_NAME || github.event.repository.name) }}

      - name: "Companion Image"
        if: needs.check-repo-state.outputs.companion_kind != ''
        uses: ./.github/actions/docker-build
        with:
          push: 'false'
          image_name: ${{ format('{0}{1}', vars.SERVICE_NAME || github.event.repository.name, needs.check-repo-state.outputs.companion_package_suffix) }}
          build_kind: source-direct
          build_context: ${{ needs.check-repo-state.outputs.companion_image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.companion_image_dockerfile }}

      - name: "Acceptance Image"
        # Proves every suite's prewarm build before the trusted lane bakes it; skips when no suite exists.
        uses: ./.github/actions/acceptance-image
        with:
          push: 'false'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}

      - name: "Load Image"
        # Proves the loader image builds when the checkout carries deployments/shared-schemas; skips otherwise.
        uses: ./.github/actions/load-image
        with:
          push: 'false'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}

  docker-push:
    name: "Docker Push"
    needs: [check-initialization, check-repo-state, java-build, node-build, python-build, native-container-build, companion-python-build, docker-build]
    # Trust boundary (ADR-036): push to GHCR only on trusted events.
    if: |
      always() && (
        (needs.java-build.outputs.build_result == 'success' ||
         needs.node-build.outputs.build_result == 'success' ||
         needs.python-build.outputs.build_result == 'success' ||
         needs.native-container-build.outputs.build_result == 'success') &&
        (needs.check-repo-state.outputs.companion_kind == '' ||
         needs.companion-python-build.outputs.build_result == 'success') &&
        github.actor != 'dependabot[bot]' &&
        github.event_name != 'pull_request_target' &&
        github.event_name != 'workflow_dispatch' &&
        (github.base_ref != 'fork_upstream' && github.ref_name != 'fork_upstream') &&
        (github.event_name != 'pull_request' ||
         github.event.pull_request.head.repo.full_name == github.repository)
      ) || (
        github.event_name == 'workflow_dispatch' &&
        inputs.force_full_pipeline == true
      )
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write         # only this job has registry write
    outputs:
      image_repository: ${{ steps.push.outputs.image_repository }}
      image_digest: ${{ steps.push.outputs.image_digest }}
      companion_image_repository: ${{ steps.companion.outputs.image_repository }}
      companion_image_digest: ${{ steps.companion.outputs.image_digest }}
      acceptance_image_repository: ${{ steps.acceptance.outputs.image_repository }}
      acceptance_image_digest: ${{ steps.acceptance.outputs.image_digest }}
      acceptance_skipped: ${{ steps.acceptance.outputs.skipped }}
      dag_artifact_repository: ${{ steps.dag.outputs.artifact_repository }}
      dag_artifact_digest: ${{ steps.dag.outputs.artifact_digest }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}

      - name: "Download Airflow DAG artifact"
        if: >-
          needs.check-repo-state.outputs.archetype == 'airflow-dag-azure' ||
          needs.check-repo-state.outputs.companion_kind == 'airflow-dag'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093  # v4.3.0
        with:
          name: airflow-dag-artifact
          path: .spi/artifacts

      - name: "Docker Build and Push"
        id: push
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          build_kind: ${{ needs.check-repo-state.outputs.archetype == 'java-maven-azure' && 'maven-jar' || (needs.check-repo-state.outputs.archetype == 'node-typescript-azure' && 'source' || 'source-direct') }}
          build_context: ${{ needs.check-repo-state.outputs.image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.image_dockerfile }}
          platforms: ${{ needs.check-repo-state.outputs.image_platforms }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          jar_file: ${{ vars.SERVICE_TARGET_JAR || format('provider/{0}-azure/target/*-spring-boot.jar', vars.SERVICE_NAME || github.event.repository.name) }}

      - name: "Companion Image Build and Push"
        id: companion
        if: needs.check-repo-state.outputs.companion_kind != ''
        uses: ./.github/actions/docker-build
        with:
          push: 'true'
          image_name: ${{ format('{0}{1}', vars.SERVICE_NAME || github.event.repository.name, needs.check-repo-state.outputs.companion_package_suffix) }}
          build_kind: source-direct
          build_context: ${{ needs.check-repo-state.outputs.companion_image_context }}
          dockerfile_path: ${{ needs.check-repo-state.outputs.companion_image_dockerfile }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Acceptance Image Build and Push"
        # The suite ships as ghcr.io/<org>/<svc>-acceptance:sha-<sha> from the same commit as the
        # service image. Rides this job to inherit the ADR-036 trust gate; skips when no suite exists.
        id: acceptance
        uses: ./.github/actions/acceptance-image
        with:
          push: 'true'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Load Image Build and Push"
        # The shared-schemas payload ships as ghcr.io/<org>/<svc>-load:sha-<sha> from the same commit
        # (ADR-042), so the stack pairs service and loader by commit. Skips when no payload exists.
        id: load
        uses: ./.github/actions/load-image
        with:
          push: 'true'
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Airflow DAG Artifact Push"
        id: dag
        if: >-
          needs.check-repo-state.outputs.archetype == 'airflow-dag-azure' ||
          needs.check-repo-state.outputs.companion_kind == 'airflow-dag'
        uses: ./.github/actions/dag-artifact
        with:
          push: "true"
          image_name: ${{ vars.SERVICE_NAME || github.event.repository.name }}
          github_token: ${{ secrets.GITHUB_TOKEN }}

  deploy-gate:
    # Decides whether Borrow, Prove, Restore runs and says why when it does not, so the
    # absence of the lane on a run is never silent. Carries the ADR-036 trust clause in full:
    # only a push or a same-repository pull request, never Dependabot, never fork_upstream.
    name: "Deploy Gate"
    needs: [docker-push]
    if: always()
    runs-on: ubuntu-latest
    outputs:
      run: ${{ steps.decide.outputs.run }}
      reason: ${{ steps.decide.outputs.reason }}
      service: ${{ steps.decide.outputs.service }}
      deploy_only: ${{ steps.decide.outputs.deploy_only }}
    steps:
      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          sparse-checkout: |
            .spi
            .github/actions/acceptance-resolver
          sparse-checkout-cone-mode: false

      - name: "Decide"
        id: decide
        env:
          EVENT: ${{ github.event_name }}
          ACTOR: ${{ github.actor }}
          REF: ${{ github.base_ref || github.ref_name }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
          # Same five values check-required-variables.sh gates onboarding on; partial config must fail here, not at Azure login.
          MISSING: >-
            ${{ secrets.AZURE_CLIENT_ID == '' && 'AZURE_CLIENT_ID ' || '' }}${{ vars.AZURE_TENANT_ID == '' && 'AZURE_TENANT_ID ' || '' }}${{ vars.AZURE_SUBSCRIPTION_ID == '' && 'AZURE_SUBSCRIPTION_ID ' || '' }}${{ vars.SPI_STACK_RESOURCE_GROUP == '' && 'SPI_STACK_RESOURCE_GROUP ' || '' }}${{ vars.SPI_STACK_CLUSTER == '' && 'SPI_STACK_CLUSTER' || '' }}
          CLUSTER: ${{ vars.SPI_STACK_CLUSTER }}
          PUSH_RESULT: ${{ needs.docker-push.result }}
          ACCEPTANCE_SKIPPED: ${{ needs.docker-push.outputs.acceptance_skipped }}
        run: |
          reason=""
          case "$EVENT" in
            push|pull_request) ;;
            *) reason="$EVENT runs never borrow the environment" ;;
          esac
          [ -n "$reason" ] || [ "$EVENT" != "pull_request" ] || [ "$SAME_REPO" = "true" ] || reason="pull request from another repository carries no deploy identity"
          [ -n "$reason" ] || [ "$ACTOR" != "dependabot[bot]" ] || reason="Dependabot updates validate through dependabot-validation.yml"
          [ -n "$reason" ] || [ "$REF" != "fork_upstream" ] || reason="fork_upstream builds no Azure image"
          [ -n "$reason" ] || [ -z "${MISSING// /}" ] || reason="repository is not onboarded to a stack (missing: $(echo $MISSING))"
          [ -n "$reason" ] || [ -f .spi/service.yaml ] || reason="no .spi/service.yaml declares the suites"
          # The stack knows the descriptor's service.name. The image name (SERVICE_NAME, or the
          # repository name when unset) differs from it where repositories are prefixed (osdu-spi-<service>).
          # Resolved before the push checks: a rejected descriptor already failed docker-build, and
          # the gate names the rejection rather than the missing image it caused.
          service=""
          suites=0
          if [ -z "$reason" ]; then
            if python3 .github/actions/acceptance-resolver/resolve.py --contract-only \
                --descriptor .spi/service.yaml --report contract.json > /dev/null 2>&1; then
              service=$(jq -r '.service // empty' contract.json)
              suites=$(jq -r '.contract.suites | length' contract.json)
            else
              reason=$(jq -r '.error | "descriptor rejected, \(.code): \(.detail)"' contract.json 2>/dev/null || echo "descriptor rejected by the resolver")
            fi
          fi
          [ -n "$reason" ] || [ "$PUSH_RESULT" = "success" ] || reason="no image was pushed (docker-push: $PUSH_RESULT)"
          # A deploy-only descriptor (empty tests map) has no acceptance image and still borrows.
          [ -n "$reason" ] || [ "$suites" = "0" ] || [ "$ACCEPTANCE_SKIPPED" != "true" ] || reason="the descriptor declares suites but no acceptance image was built"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          deploy_only=false; [ -z "$service" ] || [ "$suites" != "0" ] || deploy_only=true
          echo "deploy_only=$deploy_only" >> "$GITHUB_OUTPUT"
          if [ -n "$reason" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"; echo "reason=$reason" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deploy and Test skipped::$reason"
            echo "Deploy and Test: skipped, $reason" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"; echo "reason=" >> "$GITHUB_OUTPUT"
            scope="with the pushed image"; [ "$suites" != "0" ] || scope="with the pushed image, deploy only"
            echo "Deploy and Test: borrowing $CLUSTER for $service $scope" >> "$GITHUB_STEP_SUMMARY"
          fi

  deploy-test:
    # Borrow, Prove, Restore (ADR-041): one credentialed job in the fork's spi-stack environment.
    # Pins the image just pushed onto the attached stack, proves it with every suite the
    # descriptor declares, and restores the canonical image whatever happened. A maintainer who
    # wants a human pause before a borrow adds required reviewers to the environment.
    name: "Deploy and Test"
    needs: [docker-push, deploy-gate]
    # docker-push has archetype-specific skipped dependencies. always() makes this
    # job evaluate the gate output instead of inheriting those transitive skips.
    if: always() && needs.deploy-gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    outputs:
      verdicts: ${{ steps.prove.outputs.verdicts }}
    environment: spi-stack
    concurrency:
      group: spi-stack-${{ needs.deploy-gate.outputs.service }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      packages: read
    env:
      SERVICE: ${{ needs.deploy-gate.outputs.service }}
      SERVICE_IMAGE: ${{ needs.docker-push.outputs.image_repository }}@${{ needs.docker-push.outputs.image_digest }}
      TEST_IMAGE: ${{ needs.docker-push.outputs.acceptance_image_repository }}@${{ needs.docker-push.outputs.acceptance_image_digest }}
      STACK_REPO: Azure/osdu-spi-stack
    steps:
      - name: "Checkout"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1

      - name: "Log in as deploy identity"
        uses: azure/login@7ddb5af1ef8758cf1353cf3b42f940aee27ba21c  # v3.0.2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: "Set up uv"
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: false

      - name: "Install spi"
        # The latest release first, to reach the environment; the exact release it runs follows.
        id: install
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          sudo az aks install-cli --gh-token "$GH_TOKEN"
          tag=$(gh release view --repo "$STACK_REPO" --json tagName --jq .tagName)
          gh release download "$tag" --repo "$STACK_REPO" --pattern "spi-${tag#v}-py3-none-any.whl" --dir "$RUNNER_TEMP/spi" --clobber
          uv tool install "$RUNNER_TEMP/spi/spi-${tag#v}-py3-none-any.whl"
          spi --version

      - name: "Connect to cluster"
        env:
          RESOURCE_GROUP: ${{ vars.SPI_STACK_RESOURCE_GROUP }}
          CLUSTER: ${{ vars.SPI_STACK_CLUSTER }}
        run: spi connect --resource-group "$RESOURCE_GROUP" --cluster "$CLUSTER"

      - name: "Match stack version"
        # The CLI that proves an environment is the release the environment was built with.
        # An environment on a branch (a personal stack tracking main) keeps the latest release.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Exit 2 means not deployable, which the next step decides; the version is still in the output.
          spi status --json > status.json || true
          jq -e 'type == "object"' status.json > /dev/null 2>&1 \
            || { echo "::error::spi status --json produced no JSON"; cat status.json; exit 1; }
          version=$(jq -r '.environment.stackVersion // empty' status.json)
          case "$version" in
            v[0-9]*)
              if [ "$(spi --version)" != "spi ${version#v}" ]; then
                gh release download "$version" --repo "$STACK_REPO" --pattern "spi-${version#v}-py3-none-any.whl" --dir "$RUNNER_TEMP/spi" --clobber
                uv tool install --force "$RUNNER_TEMP/spi/spi-${version#v}-py3-none-any.whl"
              fi
              ;;
            *) echo "environment runs ${version:-an unrecorded version}; keeping $(spi --version)" ;;
          esac
          spi --version

      - name: "Confirm environment deployable"
        # Lanes for different services share one environment and only serialize per service,
        # so another service's borrow shows up here as not deployable. Ten minutes covers a
        # borrow plus its restore.
        id: gate
        run: |
          set -uo pipefail
          started=$SECONDS
          deadline=$((started + 10 * 60))
          waited=false
          until spi status --json > status.json; jq -e '.deployable == true' status.json > /dev/null 2>&1; do
            if jq -e 'type == "object"' status.json > /dev/null 2>&1; then
              reason=$(jq -r '.reason.message // "unknown"' status.json)
            else
              reason="spi status --json produced no JSON"
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::environment is not deployable after 10 minutes: $reason"
              echo "Deploy and Test: environment not deployable after 10 minutes, $reason" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            $waited || echo "::notice::waiting for the environment: $reason"
            waited=true
            sleep 20
          done
          ! $waited || echo "Deploy and Test: waited $((SECONDS - started))s for the environment" >> "$GITHUB_STEP_SUMMARY"
          set -e
          spi info --json > facts.json
          audience=$(jq -r '.azure.token_audience | select(type == "string")' facts.json)
          echo "$audience" | grep -Eq '^[A-Za-z0-9:/._-]+$' || { echo "::error::token_audience is missing or malformed in spi info output"; exit 1; }
          echo "audience=$audience" >> "$GITHUB_OUTPUT"
          member=$(jq -r '.deploy_identity.member_client_id | select(type == "string")' facts.json)
          echo "member_client_id=$member" >> "$GITHUB_OUTPUT"
          no_access=$(jq -r '.deploy_identity.no_access_client_id | select(type == "string")' facts.json)
          echo "no_access_client_id=$no_access" >> "$GITHUB_OUTPUT"

      - name: "Borrow"
        # The pin write refuses when the environment is not deployable, and another service's
        # lane can borrow between the gate and this step. A readiness refusal from the pin itself
        # is that race even when status has converged by the time it is read, and is retried; any
        # other refusal while status reads deployable is an error.
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 10 * 60))
          until { spi service pin "$SERVICE" --image "$SERVICE_IMAGE" \
              --ephemeral --run-id "$GITHUB_RUN_ID" \
              --source-repo "$GITHUB_REPOSITORY" --source-sha "$GITHUB_SHA" \
              --source-run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" > pin.out 2>&1; rc=$?; cat pin.out; [ "$rc" -eq 0 ]; }; do
            # spi wraps its console output, so the refusal is matched with whitespace collapsed.
            refusal=$(tr -s '[:space:]' ' ' < pin.out)
            spi status --json > status.json || true
            jq -e 'type == "object"' status.json > /dev/null 2>&1 \
              || { echo "::error::pin refused and spi status --json produced no JSON"; cat status.json; exit 1; }
            if [[ "$refusal" != *"retry once 'spi status' reports deployable"* ]] && jq -e '.deployable == true' status.json > /dev/null 2>&1; then
              echo "::error::pin refused while the environment is deployable"; exit 1
            fi
            if jq -e '.deployable == true' status.json > /dev/null 2>&1; then
              reason="the pin refused for readiness while status reports deployable"
            else
              reason="environment not deployable, $(jq -r '.reason.message // "no reason given"' status.json)"
            fi
            if [ $SECONDS -ge $deadline ]; then
              echo "::error::pin still refused after 10 minutes: $reason"
              echo "Deploy and Test: pin still refused after 10 minutes, $reason" >> "$GITHUB_STEP_SUMMARY"
              exit 1
            fi
            echo "::notice::pin refused ($reason); retrying"
            sleep 20
          done

      - name: "Verify"
        run: |
          set -uo pipefail
          deadline=$((SECONDS + 15 * 60))
          until spi service verify "$SERVICE" --image "$SERVICE_IMAGE" --json | tee verify.json | tail -n1 | jq -e '.outcome == "verified"' > /dev/null; do
            code=$(tail -n1 verify.json | jq -r '.code // empty' 2>/dev/null || true)
            if [ "$code" = "lock_mismatch" ]; then echo "::error::pin replaced mid-borrow"; exit 1; fi
            if [ $SECONDS -ge $deadline ]; then echo "::error::digest not live after 15 minutes"; exit 1; fi
            sleep 20
          done

      - name: "Mint test callers"
        if: needs.deploy-gate.outputs.deploy_only != 'true'
        # The deploy identity's own bearer, for the audience the facts publish, then the
        # member and no-access identities' bearers for the same audience. All three
        # exchanges request a fresh OIDC token from the run and go straight to Entra, so
        # nothing depends on the five-minute assertion azure/login cached (a lane that
        # waits on the shared stack outlives it), and the deploy identity's az session
        # stays in place for Restore. The v1 endpoint is deliberate: the services read
        # appid, which v2 tokens omit.
        env:
          AUDIENCE: ${{ steps.gate.outputs.audience }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          MEMBER_CLIENT_ID: ${{ steps.gate.outputs.member_client_id }}
          NO_ACCESS_CLIENT_ID: ${{ steps.gate.outputs.no_access_client_id }}
          TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
        run: |
          set -euo pipefail
          assertion=""
          mint() {  # <label> <client id> <resolver variable> <source name>
            if [ -z "$2" ]; then
              echo "::notice::the environment publishes no $1 identity; $4 bindings will not resolve"
              return 0
            fi
            [ -n "$assertion" ] || assertion=$(curl -sSf -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
              "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
            local token
            token=$(curl -sSf -X POST "https://login.microsoftonline.com/$TENANT_ID/oauth2/token" \
              --data-urlencode "grant_type=client_credentials" \
              --data-urlencode "client_id=$2" \
              --data-urlencode "client_assertion_type=urn:ietf:params:oauth:client-assertion-type:jwt-bearer" \
              --data-urlencode "client_assertion=$assertion" \
              --data-urlencode "resource=$AUDIENCE" | jq -r '.access_token | select(type == "string")')
            [ -n "$token" ] || { echo "::error::$1 identity $2 did not mint a token; is its federated credential onboarded?"; exit 1; }
            echo "::add-mask::$token"
            echo "$3=$token" >> "$GITHUB_ENV"
          }
          # The deploy identity is not optional: without it no suite has a run bearer.
          [ -n "$AZURE_CLIENT_ID" ] || { echo "::error::AZURE_CLIENT_ID is empty; the deploy identity cannot mint the run bearer"; exit 1; }
          mint deploy "$AZURE_CLIENT_ID" RESOLVER_TOKEN token
          mint member "$MEMBER_CLIENT_ID" RESOLVER_MEMBER_TOKEN memberToken
          mint no-access "$NO_ACCESS_CLIENT_ID" RESOLVER_NO_ACCESS_TOKEN noAccessToken

      - name: "Log in to GHCR"
        if: needs.deploy-gate.outputs.deploy_only != 'true'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee  # v4.2.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: "Prove"
        # One docker run per declared suite, bound by the resolver from the descriptor, the
        # facts, and the minted tokens, which reach the bindings with source: token,
        # source: memberToken, and source: noAccessToken.
        id: prove
        run: |
          set -euo pipefail
          failed=""
          verdicts=""
          mkdir -p reports
          trap '{ echo "verdicts<<EOF"; printf "%s" "$verdicts"; echo "EOF"; } >> "$GITHUB_OUTPUT"' EXIT
          python3 .github/actions/acceptance-resolver/resolve.py --contract-only \
            --descriptor .spi/service.yaml --report suites.json > /dev/null
          if [ "$(jq -r '.contract.suites | length' suites.json)" = "0" ]; then
            verdicts="✅ deploy only: the pushed image rolled out and verified, no suite declared"$'\n'
            echo "${verdicts%$'\n'}" >> "$GITHUB_STEP_SUMMARY"
          fi
          for suite in $(jq -r '.contract.suites | keys[]' suites.json); do
            echo "::group::suite $suite"
            report="$suite-report.json"
            if ! python3 .github/actions/acceptance-resolver/resolve.py --mode run --suite "$suite" \
                --descriptor .spi/service.yaml --facts facts.json --env-file "$suite.env" --report "$report"; then
              # The suite never started; the resolver's report says why, in the summary too.
              verdict=$(jq -r '.error | "not run, \(.code): \(.detail)"' "$report" 2>/dev/null || echo "not run, resolver failed")
              echo "::error::suite $suite $verdict"; failed="$failed $suite"
              echo "❌ suite $suite: $verdict" >> "$GITHUB_STEP_SUMMARY"
              verdicts="$verdicts❌ suite $suite: $verdict"$'\n'
              echo "::endgroup::"
              continue
            fi
            suite_dir=$(jq -r .contract.test_dir "$report")
            suite_entrypoint=$(jq -r .contract.test_entrypoint "$report")
            timeout_min=$(jq -r .contract.timeout_minutes "$report")
            report_paths=$(jq -c .contract.report_paths "$report")
            mapfile -t test_args < <(jq -r '.contract.test_arguments[]' "$report")
            # The verdict comes from the report XML copied out before the container goes.
            container="suite-$suite-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
            code=0
            timeout "${timeout_min}m" docker run --name "$container" --env-file "$suite.env" \
              -e SUITE_DIR="$suite_dir" -e SUITE_ENTRYPOINT="$suite_entrypoint" \
              "$TEST_IMAGE" "${test_args[@]}" || code=$?
            docker cp "$container:/suite/$suite_dir" "reports/$suite" > /dev/null 2>&1 || mkdir -p "reports/$suite"
            docker rm -f "$container" > /dev/null 2>&1 || true
            verdict_args=(--exit-code "$code" --reports "reports/$suite")
            if [ "$report_paths" != "[]" ]; then
              verdict_args+=(--patterns-json "$report_paths")
            fi
            if verdict=$(python3 .github/actions/acceptance-image/suite-verdict.py "${verdict_args[@]}"); then
              icon="✅"
            else
              icon="❌"; echo "::error::suite $suite $verdict"; failed="$failed $suite"
            fi
            echo "$icon suite $suite: $verdict" >> "$GITHUB_STEP_SUMMARY"
            verdicts="$verdicts$icon suite $suite: $verdict"$'\n'
            rm -f "$suite.env"
            echo "::endgroup::"
          done
          [ -z "$failed" ] || { echo "::error::failed suites:$failed"; exit 1; }

      - name: "Upload suite reports"
        if: always() && steps.prove.outcome != 'skipped' && needs.deploy-gate.outputs.deploy_only != 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: suite-reports
          overwrite: true
          path: reports/**/*.xml
          if-no-files-found: ignore
          retention-days: 14

      - name: "Restore"
        if: always() && steps.install.outcome == 'success'
        run: |
          # Exit 2 means this run no longer owned the pin (or nothing was pinned): restored already.
          code=0; spi service reset "$SERVICE" --if-run "$GITHUB_RUN_ID" --json || code=$?
          [ "$code" -eq 0 ] || [ "$code" -eq 2 ] || exit "$code"

  code-validation:
    name: "Check Code Quality"
    needs: [check-initialization, check-repo-state, check-paths, java-build, node-build, python-build]
    if: |
      always() &&
      needs.check-initialization.outputs.initialized == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Code"
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd  # v5.0.1
        with:
          ref: ${{ github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0

      - name: "Restore local actions for sync PRs"
        if: |
          github.event_name == 'pull_request_target' &&
          github.event.pull_request.base.ref == 'fork_upstream' &&
          startsWith(github.event.pull_request.head.ref, 'sync/')
        run: |
          set -euo pipefail
          # Sync branches carry no .github/actions; validate with main's trusted copy.
          echo "🔧 Restoring local actions from main branch for sync PR validation..."
          if ! git fetch origin main --depth=1; then
            echo "❌ Failed to fetch 'main' branch from origin. Cannot restore local actions."
            exit 1
          fi
          if ! git checkout origin/main -- .github/actions/; then
            echo "❌ Failed to restore .github/actions/ from origin/main. Cannot proceed with validation."
            exit 1
          fi
          echo "✅ Local actions restored - validation can proceed"

      - name: "Validate Commit Messages"
        if: |
          needs.check-repo-state.outputs.is_initialized == 'true' &&
          github.actor != 'dependabot[bot]' &&
          github.actor != 'copilot' &&
          !contains(github.actor, 'copilot') &&
          !contains(github.event.pull_request.user.login, 'copilot') &&
          github.base_ref == 'main' &&
          !contains(github.head_ref, 'fork_') &&
          !startsWith(github.event.pull_request.title, 'chore(sync)') &&
          !startsWith(github.event.pull_request.title, '⬆️ Sync with upstream') &&
          !startsWith(github.event.pull_request.title, '🚀 Production Release: Upstream Integration') &&
          !startsWith(github.head_ref, 'release/upstream-') &&
          !startsWith(github.head_ref, 'release-please--branches--')
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50  # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert
        
      - name: "Check for Merge Conflicts"
        run: |
          if git diff --check; then
            echo "No conflict markers found"
          else
            echo "::error::Conflict markers found in files"
            exit 1
          fi
          
      - name: "Verify Branch Status"
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: ${{ github.base_ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A fork PR's head branch does not exist on origin; the base repo
          # advertises every PR head at refs/pull/<n>/head, so fetch that.
          BASE_BRANCH="origin/$BASE_REF"
          CURRENT_BRANCH="refs/remotes/origin/pr-$PR_NUMBER-head"

          git fetch origin "$BASE_REF"
          git fetch origin "+refs/pull/$PR_NUMBER/head:$CURRENT_BRANCH"

          if ! git rev-parse --verify "$BASE_BRANCH" >/dev/null 2>&1; then
            echo "::error::Base branch $BASE_BRANCH not found"
            exit 1
          fi

          if ! git rev-parse --verify "$CURRENT_BRANCH" >/dev/null 2>&1; then
            echo "::error::Head of PR #$PR_NUMBER not found at $CURRENT_BRANCH after fetching refs/pull/$PR_NUMBER/head"
            exit 1
          fi

          BEHIND_BY=$(git rev-list --count "$CURRENT_BRANCH..$BASE_BRANCH")

          if [ "$BEHIND_BY" -gt 0 ]; then
            echo "::error::Branch is behind $BASE_BRANCH by $BEHIND_BY commits. Please update your branch."
            exit 1
          fi

  validation-summary:
    # The required check (ADR-030): always reports, so a path-skipped or routed-away run never
    # wedges the PR, and one table shows what ran, what was skipped, and why. always() bypasses
    # check-initialization's routing, so the lane test is repeated here.
    name: "Validation Summary"
    needs: [check-initialization, check-repo-state, check-paths, java-build, node-build, python-build, native-container-build, companion-python-build, docker-build, docker-push, deploy-gate, deploy-test, code-validation]
    if: |
      always() &&
      (github.event_name != 'pull_request' ||
       !(github.event.pull_request.head.repo.full_name == github.repository &&
         startsWith(github.event.pull_request.head.ref, 'sync/'))) &&
      (github.event_name != 'pull_request_target' ||
       (github.event.pull_request.head.repo.full_name == github.repository &&
        startsWith(github.event.pull_request.head.ref, 'sync/')))
    runs-on: ubuntu-latest
    # One summary at a time per pull request, so two rapid pushes cannot each create a comment.
    concurrency:
      group: validation-summary-${{ github.event.pull_request.number || github.run_id }}
      cancel-in-progress: false
    steps:
      - name: "Summarize"
        env:
          NEEDS: ${{ toJSON(needs) }}
          GATE_REASON: ${{ needs.deploy-gate.outputs.reason }}
          VERDICTS: ${{ needs.deploy-test.outputs.verdicts }}
          INITIALIZED: ${{ needs.check-initialization.outputs.initialized }}
          BUILD_RELEVANT: ${{ needs.check-paths.outputs.should_run }}
          ARCHETYPE: ${{ needs.check-repo-state.outputs.archetype }}
          EVENT_NAME: ${{ github.event_name }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
          ACTOR: ${{ github.actor }}
          REF_NAME: ${{ github.head_ref || github.ref_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "## Validation on $EVENT_NAME ($REF_NAME)"
            echo
            echo "| Job | Result | Note |"
            echo "|---|---|---|"
            jq -rn --arg gate "$GATE_REASON" --arg init "$INITIALIZED" --arg relevant "$BUILD_RELEVANT" \
              --arg archetype "$ARCHETYPE" --arg event "$EVENT_NAME" --arg same_repo "$SAME_REPO" --arg actor "$ACTOR" \
              --argjson needs "$NEEDS" '
              def names: {
                "check-initialization": "Check Initialization", "check-repo-state": "Check Repository",
                "check-paths": "Check Paths", "java-build": "Java Build", "node-build": "Node Build",
                "python-build": "Python Build", "native-container-build": "Native Container Build",
                "companion-python-build": "Companion Airflow Build",
                "docker-build": "Docker Build",
                "code-validation": "Check Code Quality", "docker-push": "Docker Push",
                "deploy-gate": "Deploy Gate", "deploy-test": "Deploy and Test"};
              def icon: {success: "✅", failure: "❌", cancelled: "⚠️", skipped: "⏭️"}[.] // .;
              def build: . == "java-build" or . == "node-build" or . == "python-build" or . == "native-container-build" or . == "companion-python-build" or . == "docker-build" or . == "docker-push";
              def note:
                if . == "deploy-test" and $gate != "" then $gate
                elif $needs[.].result != "skipped" then ""
                elif $init != "true" then "repository not yet initialized"
                elif build and $relevant == "false" then "only configuration or docs changed"
                elif . == "java-build" and $archetype != "java-maven-azure" then "archetype is \($archetype)"
                elif . == "node-build" and $archetype != "node-typescript-azure" then "archetype is \($archetype)"
                elif . == "python-build" and ($archetype != "python-fastapi-azure" and $archetype != "airflow-dag-azure") then "archetype is \($archetype)"
                elif . == "native-container-build" and $archetype != "native-container-azure" then "archetype is \($archetype)"
                elif . == "companion-python-build" then "no Airflow DAG companion declared"
                elif build and $archetype == "" then "service archetype is unavailable"
                elif build and $event == "pull_request_target" then "sync lane; images validate on the cascade PR"
                elif . == "docker-push" and $actor == "dependabot[bot]" then "Dependabot validates through dependabot-validation.yml"
                elif . == "docker-push" and $same_repo != "true" then "pull request from another repository"
                else "a job it needs did not run" end;
              names | keys_unsorted[] | select(in($needs)) | . as $job
                | "| \(names[$job]) | \($needs[$job].result | icon) \($needs[$job].result) | \($job | note) |"'
            if [ -n "$VERDICTS" ]; then
              echo
              printf '%s' "$VERDICTS" | sed 's/$/  /'
            fi
            echo
            echo "[Run]($RUN_URL)"
            echo
          } > summary.md
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: "Comment on the pull request"
        # A fork-head or Dependabot pull_request token is read-only, so those PRs carry no comment.
        if: |
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.repo.full_name == github.repository &&
          github.actor != 'dependabot[bot]'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # A run for a superseded push never overwrites the newer push's comment.
          current=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq .head.sha)
          [ "$current" = "$HEAD_SHA" ] || { echo "head moved to $current; leaving the comment to the newer run"; exit 0; }
          marker="<!-- validation-summary -->"
          { echo "$marker"; cat summary.md; } > comment.md
          existing=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$existing" -F body=@comment.md > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments" -F body=@comment.md > /dev/null
          fi

      - name: "Report"
        # A skipped job is a decision the gates made; only failure and cancellation fail the check.
        # Code quality stays advisory, as it was before the summary became the required check.
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          broken=$(jq -r 'to_entries[] | select(.key != "code-validation")
            | select(.value.result == "failure" or .value.result == "cancelled") | .key' <<< "$NEEDS")
          if [ -n "$broken" ]; then
            echo "❌ failed or cancelled: $(echo $broken | tr ' ' ',')"; exit 1
          fi
          if [ "${{ github.event_name }}" = "pull_request_target" ]; then
            echo "✅ Validation deferred - the sync lane leaves image validation to the cascade PR"; exit 0
          fi
          echo "✅ Validation completed"
